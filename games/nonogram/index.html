<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonogram — Offline Arcade</title>
  <meta name="description" content="Solve the picture from the number clues. 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nonogram — Offline Arcade">
  <meta property="og:description" content="Solve the picture from the number clues. 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .ngrid {
      display: grid;
      grid-template-columns: minmax(44px, auto) repeat(5, 54px);
      grid-template-rows: minmax(44px, auto) repeat(5, 54px);
      gap: 4px;
    }
    .ngrid__corner { background: transparent; }
    .clue {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: var(--bg-soft);
      border-radius: 8px;
      padding: 2px 6px;
    }
    .clue--col { flex-direction: column; gap: 0; line-height: 1.1; }
    .ncell {
      width: 54px;
      height: 54px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: var(--muted);
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.12s ease;
      padding: 0;
    }
    .ncell:hover { background: #2c3057; }
    .ncell.filled { background: var(--accent); color: #06231f; border-color: var(--accent); }
    .ncell.marked { color: var(--muted); font-size: 1.3rem; }
    .solution-mini {
      display: grid;
      grid-template-columns: repeat(5, 22px);
      grid-template-rows: repeat(5, 22px);
      gap: 3px;
      justify-content: center;
      margin: 12px auto 4px;
    }
    .solution-mini div { border-radius: 4px; background: #303456; }
    .solution-mini div.on { background: var(--accent); }
    @media (max-width: 420px) {
      .ngrid { grid-template-columns: minmax(34px, auto) repeat(5, 1fr); grid-template-rows: minmax(34px, auto) repeat(5, 1fr); width: 100%; max-width: 340px; }
      .ncell { width: 100%; height: auto; aspect-ratio: 1 / 1; font-size: 1.2rem; }
      .clue { font-size: 0.7rem; padding: 2px 4px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Nonogram</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Puzzle</span><span id="puzzle-num" class="status-bar__value">1</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Moves</span><span id="moves" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
      </div>
      <div id="ngrid" class="ngrid"></div>
      <div class="game-controls">
        <button id="new-puzzle" class="btn">New Puzzle</button>
        <button id="reset" class="btn btn--ghost">Reset</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">Left click to fill a cell, right click to mark it empty (✕). Fill the cells to match the picture. P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
