<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkers — Offline Arcade</title>
  <meta name="description" content="Men jump, kings rule — beat the computer. 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Checkers — Offline Arcade">
  <meta property="og:description" content="Men jump, kings rule — beat the computer. 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Checkers — Offline Arcade">
  <meta name="twitter:description" content="Men jump, kings rule — beat the computer. 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Checkers — wooden board and stacked-disc pieces.
       Scoped to #board/.checker-cell so shared board styles stay untouched. */
    .game-area { gap: 10px; }

    #board {
      min-width: 0;
      gap: 0;
      padding: clamp(7px, 2vw, 12px);
      border-radius: clamp(10px, 2.4vw, 16px);
      border: none;
      background: linear-gradient(145deg, #5a3a22 0%, #3f2614 55%, #2e1b0f 100%);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.5),
        inset 0 2px 0 rgba(255, 255, 255, 0.08),
        0 0 0 2px rgba(0, 0, 0, 0.35),
        inset 0 0 0 6px rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    #board .checker-cell {
      position: relative;
      isolation: isolate;
      min-width: 0;
      padding: 0;
      border: none;
      border-radius: 2px;
      transition: filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #board .checker-cell--light { background: linear-gradient(145deg, #efdfc0 0%, #e2cba2 100%); }
    #board .checker-cell--dark { background: linear-gradient(145deg, #2f7a58 0%, #1f5c41 100%); }
    #board .checker-cell--light:hover:not(:disabled) { background: linear-gradient(145deg, #f6e9cf 0%, #ead5ae 100%); }
    #board .checker-cell--dark:hover:not(:disabled) { background: linear-gradient(145deg, #378a63 0%, #256a4a 100%); }
    #board .checker-cell:active { transform: none; }
    #board .checker-cell:focus-visible { outline: 3px solid var(--accent-2); outline-offset: -3px; z-index: 3; }

    /* Piece: a ridged disc behind the glyph. */
    #board .checker-piece {
      font-size: clamp(1.15rem, 6vw, 2.35rem);
      line-height: 1;
      font-weight: 700;
    }
    #board .checker-piece::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 80%;
      height: 80%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: -1;
      transition: transform 0.14s var(--ease-pop), box-shadow 0.14s ease;
    }
    #board .checker-piece--r::before {
      background: radial-gradient(circle at 38% 30%, #e8554f 0%, #b62f2b 55%, #7d1a18 100%);
      border: 2px solid #5e1210;
      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.42),
        inset 0 0 0 3px rgba(255, 255, 255, 0.14),
        inset 0 0 0 6px rgba(0, 0, 0, 0.16),
        inset 0 3px 3px rgba(255, 255, 255, 0.25),
        inset 0 -4px 5px rgba(0, 0, 0, 0.35);
    }
    #board .checker-piece--b::before {
      background: radial-gradient(circle at 38% 30%, #4a4a56 0%, #23232c 55%, #0c0c11 100%);
      border: 2px solid #050508;
      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.5),
        inset 0 0 0 3px rgba(255, 255, 255, 0.12),
        inset 0 0 0 6px rgba(0, 0, 0, 0.22),
        inset 0 3px 3px rgba(255, 255, 255, 0.18),
        inset 0 -4px 5px rgba(0, 0, 0, 0.5);
    }
    #board .checker-piece--k::before {
      border-color: #d4af37;
      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.45),
        0 0 0 2px rgba(212, 175, 55, 0.5),
        inset 0 0 0 3px rgba(255, 255, 255, 0.16),
        inset 0 0 0 6px rgba(0, 0, 0, 0.2);
    }
    #board .checker-piece--k { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75); }

    #board .checker-cell--selected::before { transform: translate(-50%, -54%) scale(1.06); }

    #board .checker-cell--target::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 26%;
      height: 26%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      opacity: 0.95;
      pointer-events: none;
      z-index: 2;
    }

    @media (max-width: 430px) {
      #board { border-radius: 10px; padding: 6px; }
      #board .checker-piece { font-size: clamp(1.1rem, 6.4vw, 1.7rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      #board .checker-piece::before { transition: none; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Checkers</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Status</span><span id="status" class="status-bar__value" style="font-size:1rem;">Your move</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
      </div>
      <div id="board" class="board" style="grid-template-columns:repeat(8,minmax(0,1fr)); max-width:520px; width:100%; min-width:0;"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">You are Red. Captures are mandatory. P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
