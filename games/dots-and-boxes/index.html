<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dots &amp; Boxes — Offline Arcade</title>
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .dboard {
      display: grid;
      width: 100%;
      max-width: 352px;
      aspect-ratio: 1;
      grid-template-columns: 18fr 52fr 18fr 52fr 18fr 52fr 18fr 52fr 18fr;
      grid-template-rows: 18fr 52fr 18fr 52fr 18fr 52fr 18fr 52fr 18fr;
      gap: 2px;
      background: var(--bg-soft);
      padding: 10px;
      border-radius: var(--radius);
    }
    .dot { background: var(--text); border-radius: 50%; }
    .line {
      background: transparent; border: none; padding: 0; min-width: 0; min-height: 0;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .line__bar {
      background: var(--panel); border-radius: 3px;
      transition: background 0.12s ease;
    }
    .line--h .line__bar { width: 100%; height: 6px; }
    .line--v .line__bar { width: 6px; height: 100%; }
    .line:hover:not(:disabled) .line__bar { background: var(--accent); }
    .line:disabled { cursor: default; }
    .line.claimed-you .line__bar { background: var(--accent); }
    .line.claimed-cpu .line__bar { background: var(--accent-2); }
    .box {
      background: rgba(255, 255, 255, 0.02); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.3rem; color: transparent;
    }
    .box.filled-you { background: rgba(88, 224, 201, 0.22); color: var(--accent); }
    .box.filled-cpu { background: rgba(255, 204, 77, 0.2); color: var(--accent-2); }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Dots &amp; Boxes</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">You</span><span id="you-score" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">CPU</span><span id="cpu-score" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
      </div>
      <p id="turn-label" class="game-info__title">Your line — draw any segment</p>
      <div id="board" class="dboard" aria-label="Dots and Boxes board"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p class="game-info__hint">Click a line between two dots to draw it. Complete all 4 sides of a box to claim it and take another turn. Most boxes wins! Esc or P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
