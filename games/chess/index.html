<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess — Offline Arcade</title>
  <meta name="description" content="The classic strategy duel — vs an unbeatable-ish AI. 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Chess — Offline Arcade">
  <meta property="og:description" content="The classic strategy duel — vs an unbeatable-ish AI. 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Chess — Offline Arcade">
  <meta name="twitter:description" content="The classic strategy duel — vs an unbeatable-ish AI. 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Chess — wooden board and 3D piece tokens.
       Scoped to #board/.chess-cell so shared board styles stay untouched. */
    .game-area { gap: 10px; }

    #board {
      min-width: 0;
      gap: 0;
      padding: clamp(7px, 2vw, 12px);
      border-radius: clamp(10px, 2.4vw, 16px);
      border: none;
      background: linear-gradient(145deg, #6b4426 0%, #4a2c15 55%, #352012 100%);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.5),
        inset 0 2px 0 rgba(255, 255, 255, 0.08),
        0 0 0 2px rgba(0, 0, 0, 0.35),
        inset 0 0 0 6px rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    #board .chess-cell {
      position: relative;
      isolation: isolate;
      min-width: 0;
      padding: 0;
      border: none;
      border-radius: 2px;
      transition: filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #board .chess-cell--light { background: linear-gradient(145deg, #f6e6c4 0%, #e9cf9e 100%); }
    #board .chess-cell--dark { background: linear-gradient(145deg, #b9855a 0%, #9a673f 100%); }
    #board .chess-cell--light:hover:not(:disabled) { background: linear-gradient(145deg, #fbf0d6 0%, #efdaab 100%); }
    #board .chess-cell--dark:hover:not(:disabled) { background: linear-gradient(145deg, #c6926a 0%, #a67249 100%); }
    #board .chess-cell:active { transform: none; }
    #board .chess-cell:focus-visible { outline: 3px solid var(--accent-2); outline-offset: -3px; z-index: 3; }

    /* Piece token: a disc behind the glyph. */
    #board .chess-cell--piece {
      font-size: clamp(1.05rem, 6.1vw, 2.45rem);
      line-height: 1;
      font-weight: 600;
    }
    #board .chess-cell--piece::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 80%;
      height: 80%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: -1;
      transition: transform 0.14s var(--ease-pop), box-shadow 0.14s ease;
    }
    #board .chess-cell--w::before {
      background: radial-gradient(circle at 38% 30%, #ffffff 0%, #f7f0de 52%, #dccbaa 100%);
      border: 1px solid #b7a582;
      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.38),
        inset 0 2px 2px rgba(255, 255, 255, 0.95),
        inset 0 -4px 5px rgba(140, 115, 75, 0.35);
    }
    #board .chess-cell--b::before {
      background: radial-gradient(circle at 38% 30%, #4d4d5a 0%, #24242d 55%, #0e0e13 100%);
      border: 1px solid #050509;
      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.5),
        inset 0 2px 2px rgba(255, 255, 255, 0.2),
        inset 0 -4px 5px rgba(0, 0, 0, 0.55);
    }
    #board .chess-cell--royal::before {
      border-color: #d4af37;
      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.4),
        0 0 0 2px rgba(212, 175, 55, 0.55),
        inset 0 2px 2px rgba(255, 255, 255, 0.4),
        inset 0 -4px 5px rgba(0, 0, 0, 0.3);
    }
    #board .chess-cell--w { color: #3a2a18; text-shadow: 0 0 1px currentColor, 0 1px 0 rgba(255, 255, 255, 0.55); }
    #board .chess-cell--b { color: #f7f1e3; text-shadow: 0 0 1px currentColor, 0 1px 2px rgba(0, 0, 0, 0.85); }

    /* Move targets: a dot on empty squares, a ring around captures. */
    #board .chess-cell--target::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24%;
      height: 24%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      opacity: 0.95;
      pointer-events: none;
      z-index: 2;
    }
    #board .chess-cell--capture::after {
      content: "";
      position: absolute;
      inset: 5%;
      width: auto;
      height: auto;
      transform: none;
      border-radius: 50%;
      background: transparent;
      border: 3px solid var(--accent);
      box-shadow: 0 0 12px var(--accent), inset 0 0 10px rgba(0, 0, 0, 0.25);
      opacity: 0.95;
      pointer-events: none;
      z-index: 2;
    }

    #board .chess-cell--check { animation: chessCheckPulse 1.2s ease-in-out infinite; }
    @keyframes chessCheckPulse {
      0%, 100% { outline: 3px solid rgba(255, 80, 80, 0.95); outline-offset: -3px; }
      50% { outline: 3px solid rgba(255, 80, 80, 0.35); outline-offset: -3px; }
    }

    @media (max-width: 430px) {
      #board { border-radius: 10px; padding: 6px; }
      #board .chess-cell--piece { font-size: clamp(1rem, 6.6vw, 1.7rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      #board .chess-cell--piece::before { transition: none; }
      #board .chess-cell--check { animation: none; outline: 3px solid #ff5050; outline-offset: -3px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Chess</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Status</span><span id="status" class="status-bar__value" style="font-size:1rem;">Your move</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
      </div>
      <div id="board" class="board" style="grid-template-columns:repeat(8,1fr); max-width:520px; width:100%;"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
        <select id="level" class="btn btn--ghost" style="padding:8px 12px;">
          <option value="2">Easy</option>
          <option value="3" selected>Normal</option>
          <option value="4">Hard</option>
        </select>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p class="game-info__hint">Click a piece to see its moves, then click a square to move. You are White. Esc or P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
