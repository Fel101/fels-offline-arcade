<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory — Offline Arcade</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Memory</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Moves</span><span id="moves" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Pairs</span><span id="pairs" class="status-bar__value">0/8</span></div>
      </div>
      <div id="board" class="board" style="grid-template-columns:repeat(4,1fr);"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
      </div>
      <p class="game-info__hint">Flip two cards to find matching pairs.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
