<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower of Hanoi — Offline Arcade</title>
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    main.game-area { justify-content: flex-start; padding-top: 18px; gap: 14px; }
    .hanoi-board { display: flex; gap: 18px; align-items: flex-end; max-width: 100%; }
    .peg {
      position: relative; width: 156px; height: 290px; border-radius: 18px;
      border: 1px solid transparent; cursor: pointer;
      transition: box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .peg:hover { background: rgba(255, 255, 255, 0.03); }
    .peg--source {
      background: rgba(77, 227, 195, 0.07);
      border-color: rgba(77, 227, 195, 0.55);
      box-shadow: 0 0 22px rgba(77, 227, 195, 0.2), inset 0 0 24px rgba(77, 227, 195, 0.08);
    }
    .peg--ok { border-color: rgba(255, 217, 77, 0.45); box-shadow: 0 0 16px rgba(255, 217, 77, 0.13); }
    .peg--shake { animation: hanoiShake 0.32s ease; }
    @keyframes hanoiShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-9px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-5px); }
    }
    .peg__rod {
      position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
      width: 12px; height: 185px; border-radius: 7px 7px 2px 2px;
      background: linear-gradient(90deg, #33365f, #5a5d94 50%, #33365f);
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
    }
    .peg__stack {
      position: absolute; bottom: 48px; left: 0; right: 0; z-index: 1;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px;
    }
    .peg__base {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      width: 148px; height: 18px; border-radius: 10px;
      background: linear-gradient(180deg, #4c4f84, #2a2c52);
      border: 1px solid var(--glass-border);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .peg__label {
      position: absolute; bottom: 0; left: 0; right: 0; text-align: center;
      font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); font-weight: 800;
    }
    .disc {
      height: 21px; border-radius: 11px; pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.55), inset 0 -4px 5px rgba(0, 0, 0, 0.35);
      transition: transform 0.18s var(--ease-pop), box-shadow 0.18s ease, width 0.2s ease;
    }
    .disc--held {
      transform: translateY(-24px) scale(1.04);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.55), 0 0 26px rgba(77, 227, 195, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.6);
    }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    @media (max-width: 560px) {
      .hanoi-board { gap: 8px; }
      .peg { width: 108px; height: 240px; }
      .peg__rod { height: 152px; }
      .peg__base { width: 102px; }
      .disc { height: 17px; border-radius: 9px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Tower of Hanoi</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Moves</span><span id="moves" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Minimum</span><span id="min-moves" class="status-bar__value">15</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best" class="status-bar__value">—</span></div>
      </div>
      <div id="board" class="hanoi-board" aria-label="Hanoi board">
        <div class="peg" data-peg="0" role="button" tabindex="0" aria-label="Start peg">
          <div class="peg__rod"></div>
          <div class="peg__stack"></div>
          <div class="peg__base"></div>
          <div class="peg__label">Start</div>
        </div>
        <div class="peg" data-peg="1" role="button" tabindex="0" aria-label="Spare peg">
          <div class="peg__rod"></div>
          <div class="peg__stack"></div>
          <div class="peg__base"></div>
          <div class="peg__label">Spare</div>
        </div>
        <div class="peg" data-peg="2" role="button" tabindex="0" aria-label="Goal peg">
          <div class="peg__rod"></div>
          <div class="peg__stack"></div>
          <div class="peg__base"></div>
          <div class="peg__label">Goal</div>
        </div>
      </div>
      <div class="game-controls">
        <select id="ring-select" class="btn btn--ghost" style="padding:8px 12px;" aria-label="Number of rings">
          <option value="3">3 Rings</option>
          <option value="4" selected>4 Rings</option>
          <option value="5">5 Rings</option>
          <option value="6">6 Rings</option>
          <option value="7">7 Rings</option>
        </select>
        <button id="undo-btn" class="btn btn--ghost">Undo</button>
        <button id="solve-btn" class="btn btn--ghost">Auto-Solve</button>
        <button id="cancel-btn" class="btn btn--ghost" hidden>Cancel</button>
        <button id="new-game" class="btn">New Game</button>
      </div>
      <p id="hint" class="game-info__hint">Click a peg to lift its top disc, then click another peg to drop it. Move every ring to the right peg.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
