<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper — Fel's Offline Arcade</title>
  <meta name="description" content="Classic, Time Attack, Daily or Zen — chording, 27 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Minesweeper — Fel's Offline Arcade">
  <meta property="og:description" content="Classic, Time Attack, Daily or Zen — chording, 27 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Minesweeper — Fel's Offline Arcade">
  <meta name="twitter:description" content="Classic, Time Attack, Daily or Zen — chording, 27 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Minesweeper</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>

    <main class="game-area">
      <div class="mode-bar" role="group" aria-label="Game mode">
        <button class="chip mode-chip" type="button" data-mode="classic" aria-pressed="true" title="Classic rules — flags, timer, three hints">Classic</button>
        <button class="chip mode-chip" type="button" data-mode="attack" aria-pressed="false" title="Clear the board before the countdown hits zero">Time Attack ⏱</button>
        <button class="chip mode-chip" type="button" data-mode="daily" aria-pressed="false" title="One seeded board a day — build a streak">Daily 📅</button>
        <button class="chip mode-chip" type="button" data-mode="zen" aria-pressed="false" title="Untimed and relaxed with unlimited hints">Zen 🧘</button>
      </div>

      <div class="difficulty-bar" id="difficulty-bar" role="group" aria-label="Difficulty">
        <button class="chip diff-chip" type="button" data-diff="beginner" aria-pressed="true">Beginner</button>
        <button class="chip diff-chip" type="button" data-diff="intermediate" aria-pressed="false">Intermediate</button>
        <button class="chip diff-chip" type="button" data-diff="expert" aria-pressed="false">Expert</button>
      </div>

      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Mines</span><span id="mines" class="status-bar__value">10</span></div>
        <button id="face-btn" class="ms-face" type="button" aria-label="New game" title="New game">🙂</button>
        <div class="status-bar__item"><span class="status-bar__label" id="time-label">Time</span><span id="time" class="status-bar__value">0:00</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Score</span><span id="score" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best" class="status-bar__value">—</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Hints</span><span id="hints" class="status-bar__value">3</span></div>
      </div>

      <div class="ms-progress" role="progressbar" aria-label="Board cleared" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="ms-progress-fill"></span>
      </div>

      <div class="ms-board-wrap" id="board-wrap">
        <div id="board" class="ms-board" role="group" aria-label="Minesweeper board"></div>
      </div>

      <div class="game-controls">
        <button id="flag-btn" class="btn btn--ghost" type="button" aria-pressed="false" title="Flag mode — tap to flag instead of reveal (F)">🚩 Flag mode</button>
        <button id="hint-btn" class="btn btn--ghost" type="button" title="Reveal a safe square (H)">💡 Hint</button>
        <button id="pause" class="btn btn--ghost" type="button" title="Pause (P)">Pause</button>
      </div>

      <div class="game-controls">
        <button id="new-game" class="btn" type="button">New Game</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>

      <p class="game-info__hint" id="hint">Click to reveal · Right-click to flag · Click a number with matching flags to chord · F flag · H hint · P pause</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
