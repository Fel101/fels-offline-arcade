<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Tile — Fel's Offline Arcade</title>
  <meta name="description" content="Guess the 5-letter word in 6 tries — 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Word Tile — Fel's Offline Arcade">
  <meta property="og:description" content="Guess the 5-letter word in 6 tries — 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Word Tile — Fel's Offline Arcade">
  <meta name="twitter:description" content="Guess the 5-letter word in 6 tries — 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .wboard {
      display: grid;
      grid-template-rows: repeat(6, 58px);
      gap: 6px;
    }
    .wrow {
      display: grid;
      grid-template-columns: repeat(5, 58px);
      gap: 6px;
    }
    .wtile {
      background: var(--panel);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text);
      user-select: none;
    }
    .wtile.filled { border-color: var(--muted); }
    .wtile.green { background: #3aa981; border-color: #3aa981; color: #06231f; }
    .wtile.yellow { background: #d3a92c; border-color: #d3a92c; color: #06231f; }
    .wtile.gray { background: #3a3d5e; border-color: #3a3d5e; color: var(--muted); }
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .keyboard__row { display: flex; gap: 6px; }
    .key {
      min-width: 34px;
      height: 46px;
      padding: 0 8px;
      background: #303456;
      color: var(--text);
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
    }
    .key:hover { filter: brightness(1.2); }
    .key--wide { min-width: 58px; font-size: 0.7rem; }
    .key.green { background: #3aa981; color: #06231f; }
    .key.yellow { background: #d3a92c; color: #06231f; }
    .key.gray { background: #1a1c33; color: var(--muted); }
    @media (max-width: 430px) {
      .wboard { grid-template-rows: repeat(6, 48px); gap: 5px; }
      .wrow { grid-template-columns: repeat(5, 48px); gap: 5px; }
      .wtile { font-size: 1.4rem; }
      .keyboard { gap: 5px; }
      .keyboard__row { gap: 4px; }
      .key { min-width: 26px; height: 42px; padding: 0 5px; font-size: 0.78rem; }
      .key--wide { min-width: 44px; font-size: 0.62rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Word Tile</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best Streak</span><span id="best" class="status-bar__value">0</span></div>
      </div>
      <div id="board" class="wboard"></div>
      <div id="keyboard" class="keyboard"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">Guess the 5-letter word in 6 tries. Green = right spot, yellow = wrong spot, gray = not in word. Esc pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
