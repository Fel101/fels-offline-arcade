<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow — Fel's Offline Arcade</title>
  <meta name="description" content="Connect the pipes — fill every cell. 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Flow — Fel's Offline Arcade">
  <meta property="og:description" content="Connect the pipes — fill every cell. 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Flow — Fel's Offline Arcade">
  <meta name="twitter:description" content="Connect the pipes — fill every cell. 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .flow-cell {
      position: relative;
      width: 64px;
      height: 64px;
      border: none;
      border-radius: 12px;
      background: #12142a;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.12s ease, box-shadow 0.12s ease;
    }
    .flow-cell.painted {
      background: var(--c);
      box-shadow: inset 0 -5px 10px rgba(0, 0, 0, 0.28), inset 0 3px 6px rgba(255, 255, 255, 0.25);
    }
    .flow-cell.dot::after {
      content: "";
      position: absolute;
      inset: 24%;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 10px var(--c), inset 0 -3px 5px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }
    .flow-cell.painted.dot::after {
      background: rgba(255, 255, 255, 0.92);
      box-shadow: none;
    }
    .flow-cell.locked.painted {
      filter: saturate(0.85) brightness(0.95);
    }
    .flow-cell:hover { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.18); }
    .flow-cell.painted:hover { box-shadow: inset 0 -5px 10px rgba(0,0,0,0.28), inset 0 3px 6px rgba(255,255,255,0.25), 0 0 0 2px rgba(255,255,255,0.35); }
    .level-select { padding: 8px 12px; }
    @media (max-width: 420px) {
      .flow-cell { width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 9px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Flow</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Level</span><span id="level-num" class="status-bar__value">1</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
      </div>
      <div id="board" class="board" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:8px;width:100%;max-width:360px;"></div>
      <div class="game-controls">
        <select id="level-select" class="btn btn--ghost level-select" aria-label="Choose level"></select>
        <button id="reset-level" class="btn btn--ghost">Reset Level</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">Connect matching dots with pipes. Fill every cell — click a dot to start its pipe, then click adjacent cells. Click an endpoint again to clear its pipe. P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
