<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match 3 — Offline Arcade</title>
  <meta name="description" content="Swap gems, match three, chain cascades — 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Match 3 — Offline Arcade">
  <meta property="og:description" content="Swap gems, match three, chain cascades — 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Match 3 — faceted gems in a dark board well, with swap/selection feedback.
       Scoped to .gemboard/.gem so the shared styles are untouched. */
    .gemboard {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: clamp(3px, 1vw, 5px);
      width: 100%;
      max-width: min(92vw, 430px);
      aspect-ratio: 1;
      margin: 0 auto;
      padding: clamp(7px, 2vw, 10px);
      background:
        radial-gradient(120% 120% at 50% 0%, rgba(255, 255, 255, 0.08), transparent 60%),
        linear-gradient(180deg, rgba(12, 14, 22, 0.72), rgba(8, 9, 14, 0.84));
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow:
        0 20px 44px rgba(0, 0, 0, 0.5),
        inset 0 2px 0 rgba(255, 255, 255, 0.14),
        inset 0 -8px 18px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      touch-action: manipulation;
    }

    .gem {
      position: relative;
      aspect-ratio: 1;
      border: none;
      border-radius: clamp(7px, 2vw, 11px);
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-family: inherit;
      background: rgba(0, 0, 0, 0.28);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.5),
        inset 0 -1px 0 rgba(255, 255, 255, 0.05);
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 0.14s ease, background 0.14s ease;
    }
    .gem:disabled { cursor: default; }
    .gem:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; z-index: 4; }

    /* Faceted gem body. */
    .gem__shape {
      position: relative;
      width: 82%;
      height: 82%;
      display: block;
      overflow: hidden;
      transition: transform 0.14s var(--ease-pop), filter 0.14s ease;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
      will-change: transform;
    }
    .gem__shape::after {
      content: "";
      position: absolute;
      top: 12%;
      left: 16%;
      width: 42%;
      height: 28%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 70%);
      transform: rotate(-18deg);
      pointer-events: none;
    }

    /* Per-type shape + colour. */
    .gem--0 .gem__shape {
      background: radial-gradient(circle at 34% 28%, #ffd3d3 0%, #ff5e5e 46%, #c81e2e 100%);
      border-radius: 50%;
    }
    .gem--1 .gem__shape {
      background: radial-gradient(circle at 34% 28%, #d3e2ff 0%, #5a96ff 46%, #1f4fbf 100%);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }
    .gem--2 .gem__shape {
      background: radial-gradient(circle at 34% 28%, #ccffdb 0%, #5ad18c 46%, #128a4e 100%);
      clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
    }
    .gem--3 .gem__shape {
      background: radial-gradient(circle at 34% 28%, #fff7c9 0%, #ffd94d 46%, #d99a00 100%);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    .gem--4 .gem__shape {
      background: radial-gradient(circle at 34% 28%, #e9e0ff 0%, #a78bfa 46%, #6d3fd4 100%);
      clip-path: polygon(50% 4%, 96% 96%, 4% 96%);
    }
    .gem--5 .gem__shape {
      background: radial-gradient(circle at 34% 28%, #d2fbff 0%, #5adce6 46%, #0f8f9c 100%);
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }

    /* Selection: ring + shrink, with a soft pulse. */
    .gem--sel {
      background: rgba(255, 255, 255, 0.1);
      box-shadow:
        0 0 0 3px var(--accent),
        0 0 14px 2px var(--btn-glow),
        inset 0 2px 4px rgba(0, 0, 0, 0.4);
      z-index: 3;
    }
    .gem--sel .gem__shape { transform: scale(0.86); }
    .gem--sel::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: inherit;
      border: 2px solid var(--accent);
      pointer-events: none;
      animation: gemSel 1.1s ease-in-out infinite;
    }
    @keyframes gemSel {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.07); }
    }

    /* Hover lift. */
    @media (hover: hover) {
      .gem:not(:disabled):hover { background: rgba(255, 255, 255, 0.09); }
      .gem:not(:disabled):hover .gem__shape { transform: scale(1.08); }
      .gem--sel:not(:disabled):hover .gem__shape { transform: scale(0.9); }
    }

    /* Swap slide: the gem starts offset toward the cell it came from. */
    .gem--swap { z-index: 5; }
    .gem--swap .gem__shape { animation: gemSwap 0.26s ease; }
    @keyframes gemSwap {
      0% { transform: translate(var(--sx, 0), var(--sy, 0)); }
      100% { transform: translate(0, 0); }
    }

    /* Invalid swap shake. */
    .gem--bad .gem__shape { animation: gemBad 0.32s ease; }
    @keyframes gemBad {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-18%); }
      40% { transform: translateX(16%); }
      60% { transform: translateX(-12%); }
      80% { transform: translateX(8%); }
    }

    /* Match clear: gems pop and fade out. */
    .gem--clear .gem__shape { animation: gemClear 0.3s ease forwards; }
    @keyframes gemClear {
      0% { transform: scale(1); opacity: 1; }
      55% { transform: scale(1.18); opacity: 1; }
      100% { transform: scale(0.15); opacity: 0; }
    }

    /* Gravity: gems drop into place after a clear. */
    .gem--fall { z-index: 4; }
    .gem--fall .gem__shape { animation: gemFall 0.4s cubic-bezier(0.34, 0.9, 0.42, 1.12) both; }
    @keyframes gemFall {
      0% { transform: translateY(var(--fall, -134%)); }
      100% { transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gem, .gem__shape { transition: none; }
      .gem--swap .gem__shape,
      .gem--bad .gem__shape,
      .gem--clear .gem__shape,
      .gem--fall .gem__shape,
      .gem--sel::after { animation: none; }
      .gem--sel::after { opacity: 1; }
    }

    .status-bar { gap: 18px; }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Match 3</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Score</span><span id="score" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Target</span><span id="target" class="status-bar__value">2500</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Moves</span><span id="moves" class="status-bar__value">30</span></div>
      </div>
      <p class="game-info__title" style="text-align:center;">Swap neighbours · match 3+ · chain cascades</p>
      <div id="board" class="gemboard" aria-label="Match 3 board"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">Click a gem, then an adjacent gem to swap. Match 3 or more in a row to clear them. Reach 2,500 points in 30 moves. P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
