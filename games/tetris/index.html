<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris — Offline Arcade</title>
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Tetris</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>

    <main class="game-area">
      <div class="mode-bar" role="group" aria-label="Game mode">
        <button class="chip mode-chip" type="button" data-mode="marathon" aria-pressed="true" title="Endless marathon — speed rises every 10 lines">Marathon</button>
        <button class="chip mode-chip" type="button" data-mode="sprint" aria-pressed="false" title="Clear 40 lines as fast as you can">Sprint 40</button>
        <button class="chip mode-chip" type="button" data-mode="ai" aria-pressed="false" title="Race an AI rival to 40 lines">Vs AI 🤖</button>
      </div>

      <div class="ai-difficulty" id="ai-difficulty" role="group" aria-label="AI difficulty" hidden>
        <span>AI level</span>
        <button class="chip ai-chip" type="button" data-diff="chill" aria-pressed="false">Chill</button>
        <button class="chip ai-chip" type="button" data-diff="smart" aria-pressed="true">Smart</button>
        <button class="chip ai-chip" type="button" data-diff="expert" aria-pressed="false">Expert</button>
      </div>

      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Score</span><span id="score" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Lines</span><span id="lines" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Level</span><span id="level" class="status-bar__value">1</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Time</span><span id="time" class="status-bar__value">0:00.0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best" class="status-bar__value">0</span></div>
      </div>

      <div class="tetris-layout">
        <div class="tetris-stage">
          <div class="tetris-board-wrap">
            <canvas id="board" class="tetris-canvas" width="280" height="560" aria-label="Tetris board"></canvas>
          </div>
          <div class="tetris-side">
            <div class="mini-panel">
              <span class="mini-panel__label">Hold</span>
              <canvas id="hold" class="mini-canvas" width="112" height="84" aria-label="Held piece"></canvas>
            </div>
            <div class="mini-panel">
              <span class="mini-panel__label">Next</span>
              <canvas id="next" class="mini-canvas" width="112" height="252" aria-label="Next pieces"></canvas>
            </div>
          </div>
        </div>

        <aside class="rival-panel" id="rival-panel" aria-label="AI rival" hidden>
          <div class="rival-panel__head"><span>Rival</span><b id="rival-lines">0</b></div>
          <canvas id="rival" class="rival-canvas" width="140" height="280" aria-label="AI rival board"></canvas>
          <div class="rival-panel__foot"><span id="rival-diff">Smart</span><span id="rival-pieces">0 pcs</span></div>
        </aside>
      </div>

      <div class="race-track" id="race-track" aria-label="Race progress" hidden>
        <div class="race-row"><span>You</span><div class="race-bar"><span id="race-player-fill"></span></div><b id="race-player-text">0/40</b></div>
        <div class="race-row" id="race-rival-row" hidden><span>Rival</span><div class="race-bar"><span id="race-ai-fill"></span></div><b id="race-ai-text">0/40</b></div>
      </div>

      <div class="game-controls">
        <button id="restart" class="btn" type="button">Restart</button>
        <button id="pause" class="btn btn--ghost" type="button">Pause</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>

      <p class="game-info__hint" id="hint">← → move · ↑ rotate · ↓ soft drop · Space hard drop · C hold · P pause</p>

      <div class="touch-controls" aria-label="Touch controls">
        <button type="button" data-act="left" aria-label="Move left">◀</button>
        <button type="button" data-act="rotate" aria-label="Rotate">↻</button>
        <button type="button" data-act="right" aria-label="Move right">▶</button>
        <button type="button" data-act="down" aria-label="Soft drop">▼</button>
        <button type="button" data-act="drop" aria-label="Hard drop">⤓</button>
        <button type="button" data-act="hold" aria-label="Hold piece">H</button>
      </div>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
