<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris — Offline Arcade</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../index.html">← Back to Games</a>
      <h1>Tetris</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Score</span><span id="score" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Lines</span><span id="lines" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Level</span><span id="level" class="status-bar__value">1</span></div>
      </div>
      <div style="display:flex; gap:20px; align-items:flex-start;">
        <canvas id="board" width="280" height="560"></canvas>
        <div>
          <div class="game-info__title">Next</div>
          <canvas id="next" width="112" height="112"></canvas>
        </div>
      </div>
      <div class="game-controls">
        <button id="restart" class="btn">Restart</button>
        <button id="pause" class="btn btn--ghost">Pause</button>
      </div>
      <p class="game-info__hint">◀ ▶ move · ▲/↑ rotate · ▼ soft drop · Space hard drop · P pause</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
