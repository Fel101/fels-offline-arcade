<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nim — Offline Arcade</title>
  <meta name="description" content="Take 1–3 counters vs a perfect CPU — 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nim — Offline Arcade">
  <meta property="og:description" content="Take 1–3 counters vs a perfect CPU — 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .pile {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      max-width: 420px; min-height: 70px; align-items: center;
      background: var(--bg-soft); padding: 14px 18px; border-radius: var(--radius);
    }
    .token { font-size: 1.9rem; line-height: 1; transition: opacity 0.25s ease, transform 0.25s ease; }
    .token.taken { opacity: 0.15; transform: scale(0.7); }
    .mode-btn.active { background: var(--accent); color: #06231f; }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Nim</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Losses</span><span id="losses" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Pile</span><span id="pile-count" class="status-bar__value">15</span></div>
      </div>
      <p id="turn-label" class="game-info__title" aria-live="polite">Your move — take 1 to 3</p>
      <div id="pile" class="pile" aria-label="Counters remaining"></div>
      <div class="game-controls">
        <button id="take-1" class="btn">Take 1</button>
        <button id="take-2" class="btn">Take 2</button>
        <button id="take-3" class="btn">Take 3</button>
      </div>
      <div class="game-controls">
        <button id="mode-normal" class="btn mode-btn active">Normal</button>
        <button id="mode-misere" class="btn btn--ghost mode-btn">Misère</button>
        <button id="new-game" class="btn btn--ghost">New Game</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p class="game-info__hint">Normal: whoever takes the last counter wins. Misère: whoever takes the last counter loses. The CPU plays perfectly — keys 1/2/3 take counters, P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
