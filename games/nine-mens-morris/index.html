<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nine Men's Morris — Fel's Offline Arcade</title>
  <meta name="description" content="The classic mill game — form mills, remove pieces, outthink the CPU. 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nine Men's Morris — Fel's Offline Arcade">
  <meta property="og:description" content="The classic mill game — form mills, remove pieces, outthink the CPU. 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Nine Men's Morris — Fel's Offline Arcade">
  <meta name="twitter:description" content="The classic mill game — form mills, remove pieces, outthink the CPU. 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .board-wrap {
      position: relative;
      width: 100%;
      max-width: min(92vw, 440px);
      aspect-ratio: 1;
      margin: 0 auto;
      touch-action: manipulation;
    }
    .board-svg { position: absolute; inset: 0; }
    .board-svg svg { width: 100%; height: 100%; display: block; }
    .points { position: absolute; inset: 0; }
    .point {
      position: absolute;
      width: 8.5%;
      height: 8.5%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      padding: 0;
      transition: background 0.12s ease, box-shadow 0.12s ease;
    }
    .point:hover { background: rgba(255,255,255,0.13); }
    .point--you {
      background: radial-gradient(circle at 35% 30%, #5a5a5a, #0b0b0b 70%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.25);
    }
    .point--cpu {
      background: radial-gradient(circle at 35% 30%, #ffffff, #cfcfcf 72%);
    }
    .point--sel { box-shadow: 0 0 0 3px var(--accent); }
    .point--removable { box-shadow: 0 0 0 3px var(--danger); }
    .point:disabled { cursor: default; }
    .turn-line { text-align: center; font-weight: 700; margin: 2px 0 10px; min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Nine Men's Morris</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Turn</span><span id="turn" class="status-bar__value" style="font-size:1.05rem;">Your move</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
      </div>
      <p id="turn-line" class="turn-line" aria-live="polite">Place your nine pieces</p>
      <div id="board" class="board-wrap" aria-label="Nine Men's Morris board">
        <div id="board-svg" class="board-svg" aria-hidden="true"></div>
        <div id="points" class="points"></div>
      </div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
        <select id="ai-diff" class="btn btn--ghost" style="padding:8px 12px;" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">Place all nine pieces, then move along the lines. Three in a row is a mill — click an enemy piece to remove it. Reduce the CPU to two pieces to win. P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
