<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lights Out — Offline Arcade</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .lights-cell {
      width: 76px;
      height: 76px;
      border: none;
      border-radius: 12px;
      background: #12142a;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }
    .lights-cell:hover { transform: scale(1.05); }
    .lights-cell.lit {
      background: #58e0c9;
      box-shadow: 0 0 18px 4px rgba(88, 224, 201, 0.55), inset 0 -4px 8px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Lights Out</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Moves</span><span id="moves" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
      </div>
      <div id="board" class="board" style="grid-template-columns:repeat(5,1fr);"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
      </div>
      <p class="game-info__hint">Turn every light OFF. Clicking a cell toggles it and its orthogonal neighbors.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
