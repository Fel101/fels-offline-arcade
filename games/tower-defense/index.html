<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defense — Offline Arcade</title>
  <meta name="description" content="Build towers, stop the waves, protect the base — 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tower Defense — Offline Arcade">
  <meta property="og:description" content="Build towers, stop the waves, protect the base — 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .game-area { padding-bottom: 16px; }
    #game {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 14px;
      box-shadow: var(--shadow);
      touch-action: manipulation;
      cursor: crosshair;
    }
    .status-bar { gap: 16px; }
    .td-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 12px auto 0;
      max-width: min(94vw, 576px);
    }
    .td-tower {
      flex: 1 1 120px;
      max-width: 170px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.06);
      color: var(--text, #f2f2f5);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: flex-start;
      transition: background 0.1s ease, box-shadow 0.1s ease;
    }
    .td-tower:hover { background: rgba(255,255,255,0.11); }
    .td-tower--active { box-shadow: 0 0 0 2px var(--accent); background: rgba(90,209,184,0.16); }
    .td-tower__name { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }
    .td-tower__cost { opacity: 0.8; font-size: 0.76rem; }
    .td-swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
    .td-actions { gap: 8px; }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Tower Defense</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Gold</span><span id="gold" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Lives</span><span id="lives" class="status-bar__value">20</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wave</span><span id="wave" class="status-bar__value">0/10</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Speed</span><span id="speed" class="status-bar__value">1×</span></div>
      </div>
      <canvas id="game" width="576" height="384" aria-label="Tower defense battlefield"></canvas>
      <div id="palette" class="td-palette" aria-label="Tower types"></div>
      <div class="game-controls">
        <button id="start-wave" class="btn" type="button">▶ Start Wave</button>
        <button id="speed-btn" class="btn btn--ghost" type="button">1× Speed</button>
      </div>
      <div class="game-controls td-actions">
        <button id="upgrade" class="btn btn--ghost" type="button" disabled>⬆ Upgrade</button>
        <button id="sell" class="btn btn--ghost" type="button" disabled>💥 Sell</button>
        <button id="restart" class="btn btn--ghost" type="button">New Game</button>
      </div>
      <div class="game-controls">
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">Pick a tower, then click a grass tile to build. Click a built tower to upgrade or sell it. Press Start Wave when ready. P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
