<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Square — Offline Arcade</title>
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .ws-board {
      display: grid;
      grid-template-columns: repeat(5, 64px);
      grid-template-rows: repeat(5, 64px);
      gap: 8px;
      padding: 12px;
      border-radius: 22px;
      background: linear-gradient(170deg, rgba(255,255,255,0.13), rgba(255,255,255,0.05));
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 44px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .ws-cell {
      background: linear-gradient(180deg, #2d3058 0%, #22264a 100%);
      border: 2px solid rgba(255,255,255,0.09);
      border-radius: 13px;
      color: var(--text);
      font-size: 1.7rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.1);
      transition: box-shadow 0.18s ease, border-color 0.18s ease, transform 0.12s ease, background 0.18s ease;
    }
    .ws-cell:hover { background: linear-gradient(180deg, #383c68 0%, #2a2d54 100%); }
    .ws-cell.selected {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 1px var(--accent-2), 0 0 16px rgba(255, 217, 77, 0.45), inset 0 1px 0 rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }
    .ws-cell.locked {
      color: var(--accent);
      border-color: rgba(77, 227, 195, 0.55);
      cursor: default;
    }
    .ws-cell.valid {
      border-color: var(--accent);
      background: linear-gradient(180deg, #24544a 0%, #1c423a 100%);
      box-shadow: 0 0 14px rgba(77, 227, 195, 0.45), inset 0 0 10px rgba(77, 227, 195, 0.28);
    }
    .ws-cell.valid.selected {
      box-shadow: 0 0 0 1px var(--accent-2), 0 0 18px rgba(77, 227, 195, 0.6), inset 0 0 10px rgba(77, 227, 195, 0.3);
    }
    @media (max-width: 520px) {
      .ws-board { grid-template-columns: repeat(5, 52px); grid-template-rows: repeat(5, 52px); gap: 6px; }
      .ws-cell { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Word Square</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Time</span><span id="time" class="status-bar__value">0:00</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best" class="status-bar__value">—</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Puzzle</span><span id="puzzle" class="status-bar__value" style="font-size:1.1rem;">1 / 13</span></div>
      </div>
      <div id="board" class="ws-board" aria-label="Word square grid"></div>
      <div class="game-controls">
        <button id="hint" class="btn btn--ghost">💡 Hint</button>
        <button id="reset" class="btn btn--ghost">Reset</button>
        <button id="new-puzzle" class="btn">New Puzzle</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p class="game-info__hint">Every row and every column must spell a 5-letter word. Click a cell to select, type to fill, arrows to move. Esc pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
