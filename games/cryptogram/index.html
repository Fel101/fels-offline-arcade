<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cryptogram — Offline Arcade</title>
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .status-bar { gap: 22px; }
    .crypto-board {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 22px;
      justify-content: center;
      max-width: 980px;
    }
    .crypto-word { display: flex; gap: 6px; }
    .crypto-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .crypto-cipher {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--muted);
      letter-spacing: 1px;
      user-select: none;
    }
    .crypto-slot {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      background: var(--panel);
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
    }
    .crypto-slot:hover { border-color: var(--accent); }
    .crypto-slot.selected {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 1px var(--accent-2), 0 0 14px rgba(255, 217, 77, 0.4);
      transform: translateY(-2px);
    }
    .crypto-slot.locked {
      background: linear-gradient(180deg, #2c5c50, #21463d);
      border-color: var(--accent);
      color: var(--accent);
      cursor: default;
    }
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .keyboard__row { display: flex; gap: 6px; }
    .key {
      min-width: 34px;
      height: 46px;
      padding: 0 8px;
      background: #303456;
      color: var(--text);
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
    }
    .key:hover { filter: brightness(1.2); }
    .key--wide { min-width: 58px; font-size: 0.7rem; }
    .source-line { font-style: italic; }
    @media (max-width: 520px) {
      .crypto-slot { width: 26px; height: 26px; font-size: 0.9rem; }
      .crypto-cipher { font-size: 0.85rem; }
      .crypto-word { gap: 4px; }
      .crypto-board { gap: 12px 14px; }
      .key { min-width: 26px; height: 40px; padding: 0 5px; font-size: 0.7rem; }
      .key--wide { min-width: 44px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Cryptogram</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Solved</span><span id="solves" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Time</span><span id="time" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best" class="status-bar__value">—</span></div>
      </div>
      <p class="game-info__hint source-line">source: <span id="source">proverb</span></p>
      <div id="board" class="crypto-board" aria-label="Cipher grid"></div>
      <div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div>
      <div class="game-controls">
        <button id="hint" class="btn btn--ghost">Hint</button>
        <button id="reset" class="btn btn--ghost">Reset</button>
        <button id="new-puzzle" class="btn">New Puzzle</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p class="game-info__hint">Click a box, then type a letter. Every matching cipher letter fills in at once. Esc pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
