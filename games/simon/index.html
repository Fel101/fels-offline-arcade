<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon — Offline Arcade</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .pads {
      display: grid;
      grid-template-columns: repeat(2, 150px);
      grid-template-rows: repeat(2, 150px);
      gap: 14px;
      background: var(--bg-soft);
      padding: 14px;
      border-radius: var(--radius);
    }
    .pad {
      border: none;
      border-radius: 20px;
      cursor: pointer;
      opacity: 0.55;
      filter: brightness(0.75);
      transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.1s ease, opacity 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .pad--green  { background: #2ee06f; border-bottom-right-radius: 6px; }
    .pad--red    { background: #ff5252; border-bottom-left-radius: 6px; }
    .pad--yellow { background: #ffd32a; border-top-right-radius: 6px; }
    .pad--blue   { background: #3d8bff; border-top-left-radius: 6px; }
    .pad.active {
      opacity: 1;
      filter: brightness(1.45);
      transform: scale(1.07);
      box-shadow: 0 0 42px rgba(255, 255, 255, 0.35), 0 0 22px rgba(255, 255, 255, 0.25);
      z-index: 1;
    }
    .pad:disabled { cursor: default; }
    @media (max-width: 520px) {
      .pads { grid-template-columns: repeat(2, 118px); grid-template-rows: repeat(2, 118px); }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Simon</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Level</span><span id="level" class="status-bar__value">1</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best" class="status-bar__value">0</span></div>
      </div>
      <div id="pads" class="pads">
        <button id="pad-green"  class="pad pad--green"  aria-label="Green pad"></button>
        <button id="pad-red"    class="pad pad--red"    aria-label="Red pad"></button>
        <button id="pad-yellow" class="pad pad--yellow" aria-label="Yellow pad"></button>
        <button id="pad-blue"   class="pad pad--blue"   aria-label="Blue pad"></button>
      </div>
      <div class="game-controls">
        <button id="start" class="btn">Start</button>
      </div>
      <p id="status" class="game-info__hint">Press Start, watch the sequence, then repeat it.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
