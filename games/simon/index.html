<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon — Offline Arcade</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .pads {
      display: grid;
      grid-template-columns: repeat(2, 150px);
      grid-template-rows: repeat(2, 150px);
      gap: 14px;
      background: linear-gradient(170deg, #2b2d58 0%, #191b38 100%);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 3px 10px rgba(0,0,0,0.55), 0 22px 44px rgba(0,0,0,0.45), 0 0 50px rgba(77, 227, 195, 0.1);
      padding: 16px;
      border-radius: 26px;
    }
    .pad {
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: inset 0 -7px 0 rgba(0,0,0,0.32), inset 0 5px 8px rgba(255,255,255,0.4), 0 10px 24px rgba(0,0,0,0.42);
      filter: saturate(0.85) brightness(0.82);
      transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .pad--green  { background: radial-gradient(circle at 38% 32%, #6fffa0 0%, #17c164 62%, #0d8a44 100%); border-bottom-right-radius: 6px; }
    .pad--red    { background: radial-gradient(circle at 38% 32%, #ff9a9a 0%, #f04444 62%, #b02020 100%); border-bottom-left-radius: 6px; }
    .pad--yellow { background: radial-gradient(circle at 38% 32%, #ffe873 0%, #fabd2f 62%, #cf9a06 100%); border-top-right-radius: 6px; }
    .pad--blue   { background: radial-gradient(circle at 38% 32%, #7ab8ff 0%, #2f7de9 62%, #1d54ad 100%); border-top-left-radius: 6px; }
    .pad.active {
      filter: saturate(1.25) brightness(1.35);
      transform: scale(1.08);
      box-shadow: inset 0 -7px 0 rgba(0,0,0,0.32), inset 0 5px 8px rgba(255,255,255,0.55), 0 0 48px rgba(255,255,255,0.4), 0 10px 24px rgba(0,0,0,0.42);
      z-index: 1;
    }
    .pad:disabled { cursor: default; }
    @media (max-width: 520px) {
      .pads { grid-template-columns: repeat(2, 118px); grid-template-rows: repeat(2, 118px); }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Simon</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Level</span><span id="level" class="status-bar__value">1</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best" class="status-bar__value">0</span></div>
      </div>
      <div id="pads" class="pads">
        <button id="pad-green"  class="pad pad--green"  aria-label="Green pad"></button>
        <button id="pad-red"    class="pad pad--red"    aria-label="Red pad"></button>
        <button id="pad-yellow" class="pad pad--yellow" aria-label="Yellow pad"></button>
        <button id="pad-blue"   class="pad pad--blue"   aria-label="Blue pad"></button>
      </div>
      <div class="game-controls">
        <button id="start" class="btn">Start</button>
      </div>
      <p id="status" class="game-info__hint">Press Start, watch the sequence, then repeat it.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
