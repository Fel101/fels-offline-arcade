<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake — Offline Arcade</title>
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Snake</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>

    <main class="game-area">
      <div class="mode-bar" role="group" aria-label="Game mode">
        <button class="chip mode-chip" type="button" data-mode="classic" aria-pressed="true" title="Walls and your own tail end the run">Classic</button>
        <button class="chip mode-chip" type="button" data-mode="endless" aria-pressed="false" title="Walls wrap around — one life, endless chase">Endless ∞</button>
        <button class="chip mode-chip" type="button" data-mode="zen" aria-pressed="false" title="No walls, no death — just flow">Zen ☯</button>
        <button class="chip mode-chip" type="button" data-mode="ai" aria-pressed="false" title="Race a rival snake for food">Vs AI 🤖</button>
      </div>

      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Score</span><span id="score" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Length</span><span id="length" class="status-bar__value">3</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Combo</span><span id="combo" class="status-bar__value">x1</span></div>
        <div class="status-bar__item" id="rival-item" hidden><span class="status-bar__label">Rival</span><span id="rival" class="status-bar__value">0</span></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="game" class="snake-canvas" width="480" height="480" aria-label="Snake game board"></canvas>
      </div>

      <div class="combo-track" aria-hidden="true"><div class="combo-track__fill" id="combo-fill"></div></div>

      <div class="food-legend" aria-label="Food and power-ups">
        <span title="Apple: +10 points times your combo"><b class="dot dot--apple"></b>Apple +10</span>
        <span title="Golden apple: +50 points times your combo"><b class="dot dot--golden"></b>Gold +50</span>
        <span title="Ghost berry: pass through your own body for 7 seconds"><b class="dot dot--ghost"></b>Phase</span>
        <span title="Slow berry: slows the action for 6 seconds"><b class="dot dot--slow"></b>Slow</span>
        <span class="food-legend__tip">Quick bites chain up to x9</span>
      </div>

      <div class="game-controls">
        <button id="restart" class="btn" type="button">Restart</button>
        <button id="pause" class="btn btn--ghost" type="button">Pause</button>
      </div>

      <p class="game-info__hint" id="hint">Arrow keys / WASD · Swipe to turn · P to pause</p>

      <div class="dpad">
        <span class="dpad__spacer"></span><button type="button" data-dir="up" aria-label="Move up">▲</button><span class="dpad__spacer"></span>
        <button type="button" data-dir="left" aria-label="Move left">◀</button><span class="dpad__spacer"></span><button type="button" data-dir="right" aria-label="Move right">▶</button>
        <span class="dpad__spacer"></span><button type="button" data-dir="down" aria-label="Move down">▼</button><span class="dpad__spacer"></span>
      </div>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
