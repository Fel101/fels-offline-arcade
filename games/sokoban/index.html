<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sokoban — Offline Arcade</title>
  <meta name="description" content="Push every box onto a target — 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sokoban — Offline Arcade">
  <meta property="og:description" content="Push every box onto a target — 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Sokoban — Offline Arcade">
  <meta name="twitter:description" content="Push every box onto a target — 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .sokoban-board {
      display: grid;
      gap: 3px;
      padding: 12px;
      border-radius: 18px;
      background: linear-gradient(165deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 44px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.16);
    }
    .sk-cell {
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      position: relative;
    }
    .sk-floor { background: rgba(255,255,255,0.045); box-shadow: inset 0 0 6px rgba(0,0,0,0.35); }
    .sk-wall {
      background: linear-gradient(150deg, #454b7e 0%, #343961 45%, #232647 100%);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.16), inset 0 -3px 0 rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .sk-target::after {
      content: "";
      position: absolute;
      z-index: 0;
      width: 34%;
      height: 34%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #ffe27a 0%, #ffb63d 55%, #c77a12 100%);
      box-shadow: 0 0 14px rgba(255, 214, 77, 0.75), inset 0 -2px 3px rgba(0,0,0,0.35);
    }
    .sk-box {
      position: relative;
      z-index: 1;
      border-radius: 8px;
      background:
        linear-gradient(45deg, transparent 44%, rgba(74, 44, 16, 0.9) 44%, rgba(74, 44, 16, 0.9) 56%, transparent 56%),
        linear-gradient(-45deg, transparent 44%, rgba(74, 44, 16, 0.9) 44%, rgba(74, 44, 16, 0.9) 56%, transparent 56%),
        linear-gradient(180deg, #e8a75a 0%, #c9822e 50%, #8f5a1a 100%);
      border: 2px solid #6e4413;
      box-shadow: inset 0 2px 2px rgba(255,255,255,0.35), inset 0 -4px 6px rgba(0,0,0,0.4), 0 3px 6px rgba(0,0,0,0.45);
    }
    .sk-box--done {
      background:
        linear-gradient(45deg, transparent 44%, rgba(9, 71, 51, 0.9) 44%, rgba(9, 71, 51, 0.9) 56%, transparent 56%),
        linear-gradient(-45deg, transparent 44%, rgba(9, 71, 51, 0.9) 44%, rgba(9, 71, 51, 0.9) 56%, transparent 56%),
        linear-gradient(180deg, #6ff0cb 0%, #2fd0ab 55%, #128a68 100%);
      border-color: #0b5f47;
      box-shadow: 0 0 16px rgba(77, 227, 195, 0.55), inset 0 2px 2px rgba(255,255,255,0.4), inset 0 -4px 6px rgba(0,0,0,0.35);
    }
    .sk-player {
      border-radius: 50%;
      position: relative;
      z-index: 2;
      background: radial-gradient(circle at 35% 30%, #ffb3ab 0%, #ff6f61 32%, #e0402f 62%, #a32318 88%, #751a11 100%);
      box-shadow: 0 4px 6px rgba(0,0,0,0.55), inset 0 -5px 8px rgba(0,0,0,0.35), inset 0 3px 5px rgba(255,255,255,0.55);
    }
    .sk-player::after {
      content: "";
      position: absolute;
      width: 34%;
      height: 26%;
      top: 15%;
      left: 20%;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 40%, rgba(255,255,255,0.95), rgba(255,255,255,0.12) 75%);
    }
    .level-label {
      min-width: 132px;
      color: var(--muted);
      font-weight: 800;
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }
    .sokoban-layout { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .dpad-row { display: flex; justify-content: center; }
    @media (max-width: 430px) {
      .sokoban-board { gap: 2px; padding: 6px; max-width: 100%; }
      .sk-cell { width: auto !important; height: auto !important; aspect-ratio: 1 / 1; }
      .level-label { min-width: 96px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Sokoban</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Moves</span><span id="moves" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Level</span><span id="level" class="status-bar__value">1/12</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Solved</span><span id="solved" class="status-bar__value">0/12</span></div>
      </div>
      <div class="sokoban-layout">
        <div id="board" class="sokoban-board" role="grid" aria-label="Sokoban board"></div>
        <div class="game-controls">
          <button id="level-prev" class="btn btn--ghost" aria-label="Previous level">◀</button>
          <span id="level-label" class="level-label">Level 1: First Push</span>
          <button id="level-next" class="btn btn--ghost" aria-label="Next level">▶</button>
        </div>
        <div class="game-controls">
          <button id="undo" class="btn btn--ghost">Undo</button>
          <button id="reset-level" class="btn btn--ghost">Reset Level</button>
          <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
        </div>
        <div class="dpad" aria-label="Movement pad">
          <div class="dpad__spacer"></div>
          <button data-dir="up" aria-label="Move up">▲</button>
          <div class="dpad__spacer"></div>
          <button data-dir="left" aria-label="Move left">◀</button>
          <div class="dpad__spacer"></div>
          <button data-dir="right" aria-label="Move right">▶</button>
          <div class="dpad__spacer"></div>
          <button data-dir="down" aria-label="Move down">▼</button>
          <div class="dpad__spacer"></div>
        </div>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">Push every box onto a glowing target — you can't pull boxes. Arrow keys / WASD move, U undoes, Esc pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
