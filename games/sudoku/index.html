<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku — Offline Arcade</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../index.html">← Back to Games</a>
      <h1>Sudoku</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Time</span><span id="time" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Difficulty</span><span id="diff-label" class="status-bar__value" style="font-size:1.1rem;">Medium</span></div>
      </div>
      <div id="board" class="board" style="grid-template-columns:repeat(9,1fr);"></div>
      <div class="game-controls">
        <button class="btn num-btn" data-n="1">1</button>
        <button class="btn num-btn" data-n="2">2</button>
        <button class="btn num-btn" data-n="3">3</button>
        <button class="btn num-btn" data-n="4">4</button>
        <button class="btn num-btn" data-n="5">5</button>
        <button class="btn num-btn" data-n="6">6</button>
        <button class="btn num-btn" data-n="7">7</button>
        <button class="btn num-btn" data-n="8">8</button>
        <button class="btn num-btn" data-n="9">9</button>
        <button class="btn btn--ghost num-btn" data-n="0">Clear</button>
      </div>
      <div class="game-controls">
        <select id="difficulty" class="btn btn--ghost" style="padding:8px 12px;">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="new-game" class="btn">New Puzzle</button>
        <button id="check" class="btn btn--ghost">Check</button>
      </div>
      <p class="game-info__hint">Click a cell, then type a number or use the pad. Boxes outlined in white.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
