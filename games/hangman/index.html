<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman — Offline Arcade</title>
  <meta name="description" content="Guess the word before the drawing is done. 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hangman — Offline Arcade">
  <meta property="og:description" content="Guess the word before the drawing is done. 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Hangman — Offline Arcade">
  <meta name="twitter:description" content="Guess the word before the drawing is done. 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .hangman__stage {
      display: flex;
      gap: 26px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .hangman__stage canvas { max-width: 100%; height: auto; }
    .hangman__panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      min-width: 230px;
    }
    .category {
      color: var(--accent-2);
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-size: 0.85rem;
      padding: 8px 20px;
      border: 1px dashed rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: var(--glass);
    }
    .word {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 380px;
    }
    .slot {
      width: 34px;
      height: 50px;
      border-bottom: 4px solid var(--accent);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--accent);
      padding-bottom: 2px;
      user-select: none;
    }
    .slot--missed { color: var(--danger); border-bottom-color: var(--danger); }
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }
    .key-row { display: flex; gap: 7px; }
    .key {
      width: 40px;
      height: 50px;
      background: #303456;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      transition: filter 0.15s ease, background 0.15s ease;
    }
    .key:hover:not(:disabled) { filter: brightness(1.3); }
    .key:disabled { cursor: default; }
    .key--good {
      background: #1e5c46;
      border-color: #3aa981;
      color: #7dedb9;
      box-shadow: inset 0 0 0 1px #3aa981;
    }
    .key--bad {
      background: #5a2330;
      border-color: #c0392b;
      color: #ff9d9d;
      box-shadow: inset 0 0 0 1px #c0392b;
    }
    @media (max-width: 520px) {
      .key { width: 30px; height: 42px; font-size: 0.78rem; }
      .key-row { gap: 4px; }
      .slot { width: 26px; height: 42px; font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Hangman</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Lives</span><span id="lives" class="status-bar__value">6</span></div>
      </div>
      <div class="hangman__stage">
        <canvas id="gallows" width="300" height="240" aria-label="Hangman gallows drawing"></canvas>
        <div class="hangman__panel">
          <div class="category">Category: <span id="category">Animals</span></div>
          <div id="word" class="word" aria-label="Word to guess"></div>
        </div>
      </div>
      <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
      <div class="game-controls">
        <button id="new-word" class="btn">New Word</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">Guess the word one letter at a time — six wrong guesses and it's game over. Esc pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
