<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe — Offline Arcade</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../index.html">← Back to Games</a>
      <h1>Tic-Tac-Toe</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">You (X)</span><span id="you" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Draws</span><span id="draws" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">CPU (O)</span><span id="cpu" class="status-bar__value">0</span></div>
      </div>
      <div id="board" class="board" style="grid-template-columns:repeat(3,1fr);"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
        <select id="first" class="btn btn--ghost" style="padding:8px 12px;">
          <option value="you" selected>You go first</option>
          <option value="cpu">CPU goes first</option>
        </select>
      </div>
      <p class="game-info__hint">You are X. The AI plays perfectly — aim for a draw!</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
