<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solitaire — Fel's Offline Arcade</title>
  <meta name="description" content="Klondike: stack the suits A→K and clear the board. 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Solitaire — Fel's Offline Arcade">
  <meta property="og:description" content="Klondike: stack the suits A→K and clear the board. 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Solitaire — Fel's Offline Arcade">
  <meta name="twitter:description" content="Klondike: stack the suits A→K and clear the board. 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .sol-top, .sol-tableau { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .sol-spacer { width: 40px; }
    .sol-pile { position: relative; }
    .slot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 66px; height: 94px; border-radius: 10px;
      background: rgba(255,255,255,0.04); border: 2px dashed rgba(255,255,255,0.14);
      position: relative; cursor: pointer;
    }
    .slot__label { color: var(--muted); font-size: 1.6rem; }
    .sol-col { min-width: 66px; min-height: 94px; border-radius: 10px;
      background: rgba(255,255,255,0.03); border: 2px dashed rgba(255,255,255,0.10);
      display: flex; flex-direction: column; align-items: center; padding-top: 4px;
      position: relative; }
    .card {
      width: 66px; height: 94px; border-radius: 12px; background: linear-gradient(165deg, #ffffff 0%, #eef0fa 100%); color: #1a1c33;
      font-weight: 800; cursor: pointer; border: 1px solid rgba(0,0,0,0.18);
      display: flex; flex-direction: column; justify-content: space-between; padding: 6px 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.38), inset 0 1px 0 #fff; position: relative; user-select: none;
      transition: transform 0.15s ease;
    }
    .card:hover:not(.card--down) { transform: translateY(-4px); }
    .card--red { color: #d63a4a; }
    .card--black { color: #1a1c33; }
    .card--down { background: repeating-linear-gradient(45deg, #2c3057 0 8px, #232645 8px 16px); border-color: #232645; box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 0 0 3px #f8f8f4, inset 0 0 0 6px #ff6b6b; }
    .card--down::after { content: ""; }
    .rank { font-size: 1.15rem; line-height: 1; }
    .suit-big { font-size: 1.5rem; }
    .suit-small { position:absolute; bottom:6px; right:8px; font-size:0.95rem; }
    .sol-col .card { margin-top: -74px; }
    .sol-col .card:first-child { margin-top: 0; }
    .hl { box-shadow: 0 0 0 3px var(--accent) !important; }
    .sel { box-shadow: 0 0 0 3px var(--accent-2) !important; }

    /* In 3-card mode the covered cards peek out behind the playable one. */
    #waste[data-count] { z-index: 2; }
    #waste[data-count]::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: 10px;
      transform: translate(6px, -4px);
      background: repeating-linear-gradient(45deg, #2c3057 0 8px, #232645 8px 16px);
      border: 1px solid #232645;
      box-shadow: 0 3px 8px rgba(0,0,0,0.45);
      z-index: -1;
    }
    #waste[data-count]::after {
      content: attr(data-count);
      position: absolute; top: -8px; right: -8px; z-index: 3;
      min-width: 20px; height: 20px; padding: 0 4px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 999px;
      background: var(--accent); color: #08130f;
      font-size: 0.72rem; font-weight: 900;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    }
    .sol-top { align-items: center; }
    @media (max-width: 560px) {
      .card, .slot, .sol-col { width: 54px; height: 78px; }
      .rank { font-size: 0.95rem; } .suit-big { font-size: 1.2rem; }
      .sol-col .card { margin-top: -62px; }
      .sol-top, .sol-tableau { gap: 8px; }
    }
    @media (max-width: 400px) {
      .card, .slot, .sol-col { width: 44px; height: 64px; }
      .rank { font-size: 0.82rem; }
      .suit-big { font-size: 1rem; }
      .suit-small { font-size: 0.8rem; bottom: 4px; right: 5px; }
      .sol-col .card { margin-top: -50px; }
      .sol-top, .sol-tableau { gap: 5px; }
      .sol-spacer { width: 8px; }
      .slot__label { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Solitaire</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Moves</span><span id="moves" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Stock</span><span id="stock-count" class="status-bar__value">24</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
      </div>
      <div class="sol-top">
        <div id="stock" class="slot" aria-label="Stock"></div>
        <div id="waste" class="sol-pile" aria-label="Waste"></div>
        <div class="sol-spacer"></div>
        <div id="foundations" class="sol-top" style="gap:10px;"></div>
      </div>
      <div id="tableau" class="sol-tableau"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
        <button id="draw-mode" class="btn btn--ghost" type="button" title="Switch between 1-card and 3-card deals">Deal: 1 card</button>
        <button id="recycle" class="btn btn--ghost" type="button" title="Turn the discarded pile face down and keep playing">↻ Restart Deck</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p class="game-info__hint">Click a card to move it. Send cards to the foundations (A→K by suit). Double-click to fan a card home. Deal 1 or 3 at a time; when the stock runs out, hit Restart Deck (or click the empty stock) to keep playing. P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
