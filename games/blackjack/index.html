<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack — Offline Arcade</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../index.html">← Back to Games</a>
      <h1>Blackjack</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Bankroll</span><span id="bank" class="status-bar__value">100</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Bet</span><span id="bet" class="status-bar__value">0</span></div>
      </div>

      <div style="text-align:center;">
        <p class="game-info__title">Dealer</p>
        <div id="dealer-hand" class="hands"></div>
        <div id="dealer-score" class="hand-score"></div>
      </div>

      <div style="text-align:center;">
        <p class="game-info__title">You</p>
        <div id="player-hand" class="hands"></div>
        <div id="player-score" class="hand-score"></div>
      </div>

      <div id="result" class="game-info__hint" style="font-size:1.05rem;font-weight:700;color:var(--accent-2);min-height:1.4em;"></div>

      <div class="game-controls" id="bet-controls">
        <button class="btn bet-btn" data-amt="5">+5</button>
        <button class="btn bet-btn" data-amt="10">+10</button>
        <button class="btn bet-btn" data-amt="25">+25</button>
        <button id="deal" class="btn">Deal</button>
      </div>
      <div class="game-controls" id="play-controls" style="display:none;">
        <button id="hit" class="btn">Hit</button>
        <button id="stand" class="btn btn--ghost">Stand</button>
      </div>
      <p class="game-info__hint">Get closer to 21 than the dealer without busting. Ace = 1 or 11.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
