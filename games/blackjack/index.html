<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack — Offline Arcade</title>
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .game-area { gap: 8px; padding: 10px 16px 14px; justify-content: flex-start; }
    .game-header { padding: 8px 20px; }
    .game-header h1 { font-size: 1.1rem; }
    .status-bar { gap: 18px; }
    .status-bar__value { font-size: 1.15rem; }
    .status-bar__label { font-size: 0.62rem; }
    .hands { display: flex; gap: 10px; justify-content: center; min-height: 94px; }
    .game-info__title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 2px; }
    .hand-score { font-size: 0.85rem; color: var(--muted); min-height: 1.1em; margin-top: 2px; font-variant-numeric: tabular-nums; }
    #result { font-size: 0.92rem; min-height: 1.2em; }
    .game-info__hint { font-size: 0.72rem; }
    /* Card look */
    .bj-card { position: relative; width: 64px; height: 94px; border-radius: 9px; background: #f8f8f4; box-shadow: 0 3px 6px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.18); color: #14141f; font-weight: 800; user-select: none; }
    .bj-card--red { color: #c92a2a; }
    .bj-big { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.9rem; }
    .bj-corner { position: absolute; font-size: 0.72rem; line-height: 1.05; text-align: center; }
    .bj-corner .bj-suit { font-size: 0.66rem; }
    .bj-corner--tl { top: 5px; left: 6px; }
    .bj-corner--br { bottom: 5px; right: 6px; transform: rotate(180deg); }
    .bj-card--back { background: repeating-linear-gradient(45deg, #2c3057 0 8px, #232645 8px 16px); box-shadow: 0 3px 6px rgba(0,0,0,0.45), inset 0 0 0 3px #f8f8f4, inset 0 0 0 6px #ff6b6b; }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Blackjack</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Bankroll</span><span id="bank" class="status-bar__value">100</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Bet</span><span id="bet" class="status-bar__value">0</span></div>
      </div>

      <div style="text-align:center;">
        <p class="game-info__title">Dealer</p>
        <div id="dealer-hand" class="hands"></div>
        <div id="dealer-score" class="hand-score"></div>
      </div>

      <div style="text-align:center;">
        <p class="game-info__title">You</p>
        <div id="player-hand" class="hands"></div>
        <div id="player-score" class="hand-score"></div>
      </div>

      <div id="result" class="game-info__hint" style="font-size:1.05rem;font-weight:700;color:var(--accent-2);min-height:1.4em;"></div>

      <div class="game-controls" id="bet-controls">
        <button class="btn bet-btn" data-amt="5">+5</button>
        <button class="btn bet-btn" data-amt="10">+10</button>
        <button class="btn bet-btn" data-amt="25">+25</button>
        <button id="deal" class="btn">Deal</button>
      </div>
      <div class="game-controls" id="play-controls" style="display:none;">
        <button id="hit" class="btn">Hit</button>
        <button id="stand" class="btn btn--ghost">Stand</button>
      </div>
      <p class="game-info__hint">Get closer to 21 than the dealer without busting. Ace = 1 or 11.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
