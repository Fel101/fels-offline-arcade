<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack — Offline Arcade</title>
  <meta name="description" content="Get to 21 without busting — beat the dealer. 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blackjack — Offline Arcade">
  <meta property="og:description" content="Get to 21 without busting — beat the dealer. 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .game-area { gap: 8px; padding: 10px 16px 14px; justify-content: flex-start; }
    .game-header { padding: 8px 20px; }
    .game-header h1 { font-size: 1.1rem; }
    .status-bar { gap: 18px; }
    .status-bar__value { font-size: 1.15rem; }
    .status-bar__label { font-size: 0.62rem; }
    .hands { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 94px; }
    .game-info__title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 2px; }
    .hand-score { font-size: 0.85rem; color: var(--muted); min-height: 1.1em; margin-top: 2px; font-variant-numeric: tabular-nums; }
    #result { font-size: 0.92rem; min-height: 1.2em; }
    .game-info__hint { font-size: 0.72rem; }
    /* Card look */
    .bj-card { position: relative; width: 64px; height: 94px; border-radius: 9px; background: #f8f8f4; box-shadow: 0 3px 6px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.18); color: #14141f; font-weight: 800; user-select: none; }
    .bj-card--red { color: #c92a2a; }
    .bj-big { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.9rem; }
    .bj-corner { position: absolute; font-size: 0.72rem; line-height: 1.05; text-align: center; }
    .bj-corner .bj-suit { font-size: 0.66rem; }
    .bj-corner--tl { top: 5px; left: 6px; }
    .bj-corner--br { bottom: 5px; right: 6px; transform: rotate(180deg); }
    .bj-card--back { background: repeating-linear-gradient(45deg, #2c3057 0 8px, #232645 8px 16px); box-shadow: 0 3px 6px rgba(0,0,0,0.45), inset 0 0 0 3px #f8f8f4, inset 0 0 0 6px #ff6b6b; }
    @media (max-width: 430px) {
      .bj-card { width: 52px; height: 78px; }
      .bj-big { font-size: 1.5rem; }
      .hands { gap: 6px; min-height: 78px; }
      .status-bar { gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Blackjack</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Bankroll</span><span id="bank" class="status-bar__value">100</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Bet</span><span id="bet" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
      </div>

      <div style="text-align:center;">
        <p class="game-info__title">Dealer</p>
        <div id="dealer-hand" class="hands" aria-label="Dealer hand"></div>
        <div id="dealer-score" class="hand-score"></div>
      </div>

      <div style="text-align:center;">
        <p class="game-info__title">You</p>
        <div id="player-hand" class="hands" aria-label="Your hand"></div>
        <div id="player-score" class="hand-score"></div>
      </div>

      <div id="result" class="game-info__hint" style="font-size:1.05rem;font-weight:700;color:var(--accent-2);min-height:1.4em;" aria-live="polite"></div>

      <div class="game-controls" id="bet-controls">
        <button class="btn bet-btn" data-amt="5">+5</button>
        <button class="btn bet-btn" data-amt="10">+10</button>
        <button class="btn bet-btn" data-amt="25">+25</button>
        <button id="deal" class="btn">Deal</button>
      </div>
      <div class="game-controls" id="play-controls" style="display:none;">
        <button id="hit" class="btn">Hit</button>
        <button id="stand" class="btn btn--ghost">Stand</button>
      </div>
      <div class="game-controls">
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p class="game-info__hint">Get closer to 21 than the dealer without busting. Ace = 1 or 11. H / S hit or stand, P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
