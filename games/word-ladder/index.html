<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Ladder — Offline Arcade</title>
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .ladder__ends {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ladder__end {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .ladder__end-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      font-weight: 700;
    }
    .ladder__tiles {
      display: flex;
      gap: 6px;
    }
    .ladder__tile {
      width: 48px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      border-radius: 10px;
      background: linear-gradient(180deg, #2d3058 0%, #22264a 100%);
      border: 2px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25);
      user-select: none;
    }
    .ladder__tile--start {
      background: linear-gradient(180deg, #1f4a3f 0%, #17352d 100%);
      border-color: #3aa981;
    }
    .ladder__tile--target {
      background: linear-gradient(180deg, #5a2340 0%, #3f1830 100%);
      border-color: var(--accent-3);
    }
    .ladder__ends-arrow {
      font-size: 2rem;
      color: var(--accent-2);
      font-weight: 900;
      padding-top: 20px;
    }
    .ladder__chain {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      width: 100%;
      max-width: 340px;
    }
    .rung {
      display: flex;
      align-items: center;
      gap: 8px;
      animation: rungDrop 0.3s var(--ease-pop);
    }
    @keyframes rungDrop {
      from { transform: translateY(-14px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    .rung__num {
      min-width: 34px;
      text-align: right;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .rung__tiles { display: flex; gap: 4px; }
    .rung__tile {
      width: 38px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
    }
    .rung--start .rung__tile {
      background: linear-gradient(180deg, #17352d 0%, #10241e 100%);
      border-color: #3aa981;
      color: #7df0c8;
    }
    .rung--target .rung__tile {
      background: linear-gradient(180deg, #3f1830 0%, #291021 100%);
      border-color: var(--accent-3);
      color: #ffb1d4;
    }
    .rung--current .rung__tile { border-color: var(--accent-2); }
    .rung__arrow {
      font-size: 0.9rem;
      color: var(--muted);
      min-width: 24px;
      text-align: center;
    }
    .ladder__form {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .ladder__input {
      width: 150px;
      padding: 12px 14px;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-align: center;
      font-family: inherit;
      color: var(--text);
      background: var(--bg-soft);
      border: 2px solid var(--glass-border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .ladder__input:focus { border-color: var(--accent); }
    .ladder__input--shake {
      border-color: var(--danger) !important;
      animation: ladderShake 0.45s ease;
    }
    @keyframes ladderShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }
    .ladder__message {
      min-height: 1.4em;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      margin: 0;
    }
    .ladder__message--error { color: var(--danger); }
    .ladder__message--hint  { color: var(--accent); }
    .ladder__solution {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 10px 0 18px;
      font-weight: 800;
      letter-spacing: 3px;
      font-size: 1.05rem;
      color: var(--accent-2);
    }
    @media (max-width: 520px) {
      .ladder__tile { width: 38px; height: 44px; font-size: 1.25rem; }
      .rung__tile { width: 32px; height: 38px; font-size: 1.05rem; }
      .ladder__input { width: 120px; font-size: 1.1rem; letter-spacing: 4px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Word Ladder</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Steps</span><span id="steps" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Best</span><span id="best-steps" class="status-bar__value">—</span></div>
      </div>
      <div class="ladder__ends">
        <div class="ladder__end">
          <span class="ladder__end-label">Start</span>
          <div id="start-word" class="ladder__tiles"></div>
        </div>
        <div class="ladder__ends-arrow">→</div>
        <div class="ladder__end">
          <span class="ladder__end-label">Target</span>
          <div id="target-word" class="ladder__tiles"></div>
        </div>
      </div>
      <div id="chain" class="ladder__chain" aria-label="Ladder rungs"></div>
      <form id="rung-form" class="ladder__form" autocomplete="off">
        <input id="rung-input" class="ladder__input" type="text" maxlength="5" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="WORD" aria-label="Next 5-letter word">
        <button id="add-step" type="submit" class="btn">Add Step</button>
      </form>
      <p id="message" class="ladder__message" role="status"></p>
      <div class="game-controls">
        <button id="hint-btn" class="btn btn--ghost">💡 Hint</button>
        <button id="undo-btn" class="btn btn--ghost">↩ Undo</button>
        <button id="giveup-btn" class="btn btn--ghost">🏳 Give Up</button>
        <button id="new-puzzle" class="btn">New Puzzle</button>
      </div>
      <p class="game-info__hint">Change one letter per step to climb from the start word to the target word. Every step must be a real 5-letter word.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
