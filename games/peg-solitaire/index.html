<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peg Solitaire — Offline Arcade</title>
  <meta name="description" content="Jump and remove, leave one peg standing — 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Peg Solitaire — Offline Arcade">
  <meta property="og:description" content="Jump and remove, leave one peg standing — 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Peg Solitaire — Offline Arcade">
  <meta name="twitter:description" content="Jump and remove, leave one peg standing — 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    main.game-area { justify-content: flex-start; padding-top: 18px; gap: 14px; }

    /* Antique solitaire board: a beveled brass frame around a rich walnut field. */
    .peg-board {
      --cell: clamp(40px, 11vw, 56px);
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(5px, 1.4vw, 9px);
      padding: clamp(10px, 3vw, 22px);
      margin: 0 auto;
      border-radius: 26px;
      background:
        radial-gradient(70% 55% at 50% 6%, rgba(255, 230, 175, 0.2), transparent 68%),
        repeating-linear-gradient(93deg, rgba(0, 0, 0, 0.05) 0 2px, rgba(255, 255, 255, 0.02) 2px 5px),
        linear-gradient(155deg, #6d4827 0%, #4b2d15 46%, #2b180b 100%);
      border: 1px solid rgba(214, 173, 99, 0.7);
      box-shadow:
        0 26px 54px rgba(0, 0, 0, 0.6),
        0 0 0 4px rgba(28, 15, 7, 0.8),
        0 0 0 5px rgba(214, 173, 99, 0.32),
        inset 0 2px 0 rgba(255, 226, 170, 0.35),
        inset 0 -12px 26px rgba(0, 0, 0, 0.5);
      isolation: isolate;
    }
    .peg-board::before {
      /* Inlaid brass hairline just inside the frame. */
      content: "";
      position: absolute; inset: 7px;
      border-radius: 18px;
      border: 1px solid rgba(214, 173, 99, 0.3);
      box-shadow: inset 0 2px 14px rgba(0, 0, 0, 0.45);
      pointer-events: none; z-index: 0;
    }
    .peg-board::after {
      /* Soft glass sheen sweeping the top of the board. */
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 24%);
      pointer-events: none; z-index: 0;
    }

    .peg-cell, .peg-invalid { width: var(--cell); height: var(--cell); }
    .peg-cell {
      position: relative; z-index: 1;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 60%, #080401 0%, #180d03 52%, #2c1b0a 80%, #432913 100%);
      box-shadow:
        0 0 0 2px rgba(24, 13, 5, 0.92),
        0 0 0 3px rgba(214, 173, 99, 0.28),
        inset 0 6px 11px rgba(0, 0, 0, 0.92),
        inset 0 -2px 4px rgba(255, 220, 170, 0.14);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: box-shadow 0.18s ease, transform 0.18s var(--ease-pop);
    }
    .peg-cell:hover {
      box-shadow:
        0 0 0 2px rgba(24, 13, 5, 0.92),
        0 0 0 3px rgba(90, 209, 184, 0.8),
        0 0 16px rgba(90, 209, 184, 0.4),
        inset 0 6px 11px rgba(0, 0, 0, 0.92);
    }

    /* Pegs are glossy glass marbles with a specular highlight and reflection. */
    .peg {
      position: relative;
      width: 76%;
      height: 76%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 27%, #e2fff6 0%, #8ff5dc 16%, #3ddcbe 40%, #17a983 68%, #0a6b52 88%, #064433 100%);
      box-shadow:
        0 5px 9px rgba(0, 0, 0, 0.6),
        inset 0 -6px 9px rgba(0, 0, 0, 0.4),
        inset 0 3px 6px rgba(255, 255, 255, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.16);
      transition: transform 0.16s var(--ease-pop), box-shadow 0.2s ease;
      pointer-events: none;
    }
    .peg::before {
      content: "";
      position: absolute; top: 11%; left: 19%;
      width: 36%; height: 22%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0));
      transform: rotate(-24deg);
    }
    .peg::after {
      content: "";
      position: absolute; bottom: 13%; left: 24%;
      width: 46%; height: 18%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(140, 255, 228, 0.4), transparent 70%);
    }
    .peg-cell:active .peg { transform: scale(0.86); }

    .peg-cell--selected .peg {
      background:
        radial-gradient(circle at 34% 27%, #fff8d0 0%, #ffeb92 16%, #ffd94d 40%, #e0a91f 68%, #a3740d 88%, #684806 100%);
      box-shadow:
        0 0 0 3px #ffd94d,
        0 0 24px rgba(255, 217, 77, 0.7),
        0 8px 14px rgba(0, 0, 0, 0.6),
        inset 0 -6px 9px rgba(120, 70, 0, 0.45),
        inset 0 3px 6px rgba(255, 255, 255, 0.65);
      animation: pegBob 1.1s ease-in-out infinite;
    }
    @keyframes pegBob {
      0%, 100% { transform: translateY(-2px) scale(1.1); }
      50% { transform: translateY(-5px) scale(1.13); }
    }

    /* Empty holes that can be jumped into glow with a pulsing ghost ring. */
    .peg-cell--target { z-index: 2; }
    .peg-cell--target::after {
      content: "";
      position: absolute; inset: 17%;
      border-radius: 50%;
      border: 2px dashed rgba(90, 209, 184, 0.95);
      background: radial-gradient(circle, rgba(90, 209, 184, 0.2), transparent 72%);
      box-shadow: 0 0 14px rgba(90, 209, 184, 0.5);
      animation: pegPulse 1.1s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes pegPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    /* One-shot move feedback: origin ping, capture flash, landing drop. */
    .peg-cell--from::after {
      content: "";
      position: absolute; inset: 40%;
      border-radius: 50%;
      background: rgba(90, 209, 184, 0.85);
      animation: pingOut 0.5s ease-out forwards;
      pointer-events: none;
    }
    .peg-cell--capture::before {
      content: "";
      position: absolute; inset: 8%;
      border-radius: 50%;
      border: 2px solid rgba(255, 217, 77, 0.95);
      box-shadow: 0 0 16px rgba(255, 217, 77, 0.65);
      animation: captureFlash 0.45s ease-out forwards;
      pointer-events: none; z-index: 3;
    }
    .peg--land { animation: pegLand 0.36s cubic-bezier(0.2, 1.45, 0.35, 1); }
    @keyframes pingOut {
      from { transform: scale(0.6); opacity: 1; }
      to { transform: scale(1.7); opacity: 0; }
    }
    @keyframes captureFlash {
      from { transform: scale(0.55); opacity: 1; }
      to { transform: scale(1.55); opacity: 0; }
    }
    @keyframes pegLand {
      0% { transform: translateY(-18px) scale(1.18); opacity: 0.35; }
      60% { transform: translateY(2px) scale(0.96); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .btn:disabled { opacity: 0.4; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      .peg, .peg-cell { transition: none; }
      .peg-cell--selected .peg,
      .peg-cell--target::after,
      .peg-cell--from::after,
      .peg-cell--capture::before,
      .peg--land { animation: none; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Peg Solitaire</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Moves</span><span id="moves" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Pegs Left</span><span id="pegs-left" class="status-bar__value">32</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
      </div>
      <div id="board" class="peg-board" aria-label="Peg solitaire board"></div>
      <div class="game-controls">
        <button id="undo" class="btn btn--ghost">Undo</button>
        <button id="new-game" class="btn">New Board</button>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p class="game-info__hint" aria-live="polite">Click a peg to select it. Jump it over an adjacent peg into an empty hole — the jumped peg is removed. Leave exactly one peg to win! P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
