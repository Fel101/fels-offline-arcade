<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peg Solitaire — Offline Arcade</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .peg-board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      padding: 18px;
      border-radius: 24px;
      background:
        radial-gradient(120% 100% at 50% 0%, rgba(255,255,255,0.14), transparent 55%),
        linear-gradient(160deg, #5f3d1e 0%, #4a2c12 45%, #38200c 100%);
      border: 1px solid rgba(255, 220, 160, 0.28);
      box-shadow: 0 24px 48px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.18), inset 0 -6px 18px rgba(0,0,0,0.45);
    }
    .peg-cell {
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, #241203 0%, #1a0d02 70%);
      box-shadow: inset 0 5px 10px rgba(0,0,0,0.85), inset 0 -1px 0 rgba(255,255,255,0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: box-shadow 0.15s ease;
    }
    .peg-cell:hover { box-shadow: inset 0 5px 10px rgba(0,0,0,0.85), 0 0 0 2px rgba(255, 255, 255, 0.22); }
    .peg-invalid {
      width: 54px;
      height: 54px;
    }
    .peg {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #8ff5dc 0%, #3ddcbe 32%, #17a983 62%, #0b6b52 88%, #074c39 100%);
      box-shadow: 0 4px 6px rgba(0,0,0,0.55), inset 0 -5px 8px rgba(0,0,0,0.35), inset 0 3px 5px rgba(255,255,255,0.55);
      transition: transform 0.12s var(--ease-pop);
      pointer-events: none;
    }
    .peg-cell:active .peg { transform: scale(0.85); }
    .peg-cell--selected .peg {
      transform: scale(1.12);
      background: radial-gradient(circle at 35% 30%, #ffe98a 0%, #ffd94d 32%, #e0a91f 62%, #a3740d 88%, #7a580a 100%);
      box-shadow: 0 0 0 3px #ffd94d, 0 0 22px rgba(255, 217, 77, 0.65), 0 6px 10px rgba(0,0,0,0.55), inset 0 3px 5px rgba(255,255,255,0.6);
    }
    .peg-cell--target::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px dashed rgba(77, 227, 195, 0.9);
      box-shadow: 0 0 12px rgba(77, 227, 195, 0.45);
      animation: pegPulse 1.1s ease-in-out infinite;
      pointer-events: none;
    }
    .peg-cell--target { position: relative; }
    @keyframes pegPulse {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @media (max-width: 520px) {
      .peg-board { gap: 5px; padding: 12px; }
      .peg-cell, .peg-invalid { width: 40px; height: 40px; }
      .peg { width: 31px; height: 31px; }
      .peg-cell--target::after { width: 12px; height: 12px; border-width: 2px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Peg Solitaire</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">Moves</span><span id="moves" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Pegs Left</span><span id="pegs-left" class="status-bar__value">32</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
      </div>
      <div id="board" class="peg-board" aria-label="Peg solitaire board"></div>
      <div class="game-controls">
        <button id="undo" class="btn btn--ghost">Undo</button>
        <button id="new-game" class="btn">New Board</button>
      </div>
      <p class="game-info__hint">Click a peg to select it. Jump it over an adjacent peg into an empty hole — the jumped peg is removed. Leave exactly one peg to win!</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
