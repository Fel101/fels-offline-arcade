<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong — Offline Arcade</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Pong</h1>
    </header>
    <main class="game-area">
      <div class="status-bar">
        <div class="status-bar__item"><span class="status-bar__label">You</span><span id="player" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">CPU</span><span id="cpu" class="status-bar__value">0</span></div>
      </div>
      <canvas id="game" width="640" height="400"></canvas>
      <div class="game-controls">
        <button id="start" class="btn">Start</button>
        <select id="difficulty" class="btn btn--ghost" style="padding:8px 12px;">
          <option value="0.06">Easy</option>
          <option value="0.1" selected>Medium</option>
          <option value="0.16">Hard</option>
        </select>
      </div>
      <p class="game-info__hint">Move your mouse or use ↑ / ↓. First to 5 wins.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
