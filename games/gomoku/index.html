<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gomoku — Fel's Offline Arcade</title>
  <meta name="description" content="Five in a row vs the computer — 14 badges.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gomoku — Fel's Offline Arcade">
  <meta property="og:description" content="Five in a row vs the computer — 14 badges.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Gomoku — Fel's Offline Arcade">
  <meta name="twitter:description" content="Five in a row vs the computer — 14 badges.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked - fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .gboard {
      display: grid;
      gap: 2px;
      width: 100%;
      max-width: min(92vw, 440px);
      aspect-ratio: 1;
      padding: 8px;
      background: linear-gradient(170deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 20px 44px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
      touch-action: manipulation;
    }
    .gcell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 4px;
      background: rgba(255,255,255,0.035);
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .gcell:hover:not(:disabled) { background: rgba(255,255,255,0.10); }
    .gcell:disabled { cursor: default; }
    .stone {
      width: 82%;
      height: 82%;
      border-radius: 50%;
      pointer-events: none;
    }
    .stone--you {
      background: radial-gradient(circle at 34% 30%, #5a5a5a, #0b0b0b 70%);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 1px 2px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.22);
    }
    .stone--cpu {
      background: radial-gradient(circle at 34% 30%, #ffffff, #cfcfcf 72%);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="back-btn" href="../../index.html">← Back to Games</a>
      <h1>Gomoku</h1>
      <span class="game-header__spacer"></span>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <span id="sound-icon" aria-hidden="true">🔊</span>
      </button>
      <button class="icon-btn" id="badges-btn" type="button" aria-label="Badges and achievements" title="Badges &amp; achievements">
        <span aria-hidden="true">🏆</span><span class="icon-btn__count" id="badge-count">0</span>
      </button>
    </header>
    <main class="game-area">
      <div class="status-bar" aria-live="polite">
        <div class="status-bar__item"><span class="status-bar__label">Turn</span><span id="turn" class="status-bar__value" style="font-size:1.1rem;">You</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Wins</span><span id="wins" class="status-bar__value">0</span></div>
        <div class="status-bar__item"><span class="status-bar__label">Streak</span><span id="streak" class="status-bar__value">0</span></div>
      </div>
      <p class="game-info__title" style="text-align:center;">● You &nbsp; vs &nbsp; ○ CPU — connect five</p>
      <div id="board" class="gboard" role="grid" aria-label="Gomoku board"></div>
      <div class="game-controls">
        <button id="new-game" class="btn">New Game</button>
        <select id="ai-diff" class="btn btn--ghost" style="padding:8px 12px;" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
        <button id="badges2" class="btn btn--ghost" type="button">🏆 Badges</button>
      </div>
      <p id="hint" class="game-info__hint" aria-live="polite">Click an empty intersection to place your stone (●). Get five in a row. P pauses.</p>
    </main>
  </div>

  <div class="snake-toasts" id="toasts" aria-live="polite"></div>

  <div class="snake-modal" id="achv-modal" hidden>
    <div class="snake-modal__backdrop" data-close></div>
    <div class="snake-modal__panel" role="dialog" aria-modal="true" aria-labelledby="achv-title">
      <header class="snake-modal__head">
        <h2 id="achv-title">🏆 Badges <small id="achv-count">0 / 0</small></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close badges">✕</button>
      </header>
      <div class="achv-records" id="achv-records"></div>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </div>

  <script src="../../js/arcade-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
