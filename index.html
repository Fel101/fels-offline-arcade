<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Arcade</title>
  <meta name="description" content="A free offline arcade of browser games — no internet, no ads, just play.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Offline Arcade — 51 free browser games">
  <meta property="og:description" content="A self-contained, fully offline collection of 51 browser games. No server, no build step, no ads — just open index.html and play.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Offline Arcade — 51 free browser games">
  <meta name="twitter:description" content="51 browser games that run fully offline. No dependencies, no ads.">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // "system" (or anything unrecognized) leaves <html> without data-theme,
    // so CSS falls back to prefers-color-scheme, then dark.
    (() => {
      try {
        var saved = localStorage.getItem("offline-arcade:theme:v1");
        var theme = "system";
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (parsed === "dark" || parsed === "light" || parsed === "kids") theme = parsed;
          } catch (_) {
            if (saved === "dark" || saved === "light" || saved === "kids") theme = saved;
          }
        }
        if (theme !== "system") document.documentElement.dataset.theme = theme;
      } catch (_) {
        /* storage blocked — fall back to system default */
      }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="portal">
    <main>
      <section class="portal__hero">
        <h1 class="portal__logo"><span aria-hidden="true">🎮</span> Offline Arcade</h1>
        <p class="portal__tagline">A bunch of games to play — no internet, no ads, just play.</p>
      </section>

      <noscript>
        <p class="portal__tagline">JavaScript is disabled — enable it to load the game grid.</p>
      </noscript>

      <section class="portal__toolbar" id="toolbar" aria-label="Search games" hidden>
        <div class="portal__search">
          <label class="visually-hidden" for="search">Search games</label>
          <input id="search" type="search" placeholder="Search games…" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-controls="grid">
        </div>
        <button type="button" id="random" class="btn btn--ghost">
          <span aria-hidden="true">🎲</span> Random game
        </button>
        <div class="theme-picker">
          <button type="button" id="theme-toggle" class="theme-picker__toggle" aria-haspopup="true" aria-expanded="false" aria-controls="theme-menu">
            <span aria-hidden="true" id="theme-icon">🎨</span>
            <span id="theme-label">Theme</span>
          </button>
          <div id="theme-menu" class="theme-picker__menu" role="menu" aria-label="Color theme" hidden>
            <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="system">
              <span class="theme-option__swatch theme-option__swatch--system" aria-hidden="true"></span>
              <span>System</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="dark">
              <span class="theme-option__swatch theme-option__swatch--dark" aria-hidden="true"></span>
              <span>Dark</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="light">
              <span class="theme-option__swatch theme-option__swatch--light" aria-hidden="true"></span>
              <span>Light</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="kids">
              <span class="theme-option__swatch theme-option__swatch--kids" aria-hidden="true"></span>
              <span>Kids</span>
            </button>
          </div>
        </div>
      </section>

      <div id="filters" class="portal__filters" role="group" aria-label="Filter games" hidden></div>

      <p id="results" class="portal__results" role="status" aria-live="polite" hidden></p>

      <section id="recent" class="portal__recent" aria-labelledby="recent-title" hidden>
        <h2 id="recent-title" class="portal__section-title">Recently played</h2>
        <div id="recent-list" class="portal__recent-list"></div>
      </section>

      <section id="grid" class="portal__grid" aria-label="Games"></section>

      <div id="empty" class="portal__empty" hidden>
        <p id="empty-text">No games match your search or filter.</p>
        <button type="button" id="clear" class="btn btn--ghost">Clear filters</button>
      </div>
    </main>

    <footer class="portal__footer">
      <span id="game-count">51 games</span> · runs entirely in your browser · pick a game and play.
    </footer>
  </div>

  <button type="button" id="to-top" class="to-top" aria-label="Back to top" hidden>
    <span aria-hidden="true">↑</span>
  </button>

  <script>
    (() => {
      "use strict";

      // Add a new game here — one line per entry. The footer count, category
      // filters, and search all update automatically.
      const GAMES = [
        { name: "snake", display: "Snake", emoji: "🐍", category: "Arcade", desc: "Eat, chain combos, unlock badges — or race an AI snake.", url: "games/snake/index.html" },
        { name: "tetris", display: "Tetris", emoji: "🧱", category: "Puzzle", desc: "Marathon, Sprint 40, or race an AI rival — combos and 24 badges.", url: "games/tetris/index.html" },
        { name: "minesweeper", display: "Minesweeper", emoji: "💣", category: "Logic", desc: "Classic, Time Attack, Daily or Zen — chording, 27 badges.", url: "games/minesweeper/index.html" },
        { name: "sudoku", display: "Sudoku", emoji: "🔢", category: "Puzzle", desc: "Classic, Time Attack, Daily or X-Sudoku — notes, hints, 28 badges.", url: "games/sudoku/index.html" },
        { name: "super-sudoku", display: "Super Sudoku", emoji: "🔢", category: "Puzzle", desc: "Five overlapping cards — solve all five.", url: "games/super-sudoku/index.html" },
        { name: "kakuro", display: "Kakuro", emoji: "🧮", category: "Puzzle", desc: "Fill each run so it matches the clue sums.", url: "games/kakuro/index.html" },
        { name: "2048", display: "2048", emoji: "🔢", category: "Puzzle", desc: "Merge tiles — 3 sizes, undo, 24 badges.", url: "games/2048/index.html" },
        { name: "memory", display: "Memory", emoji: "🧠", category: "Pattern", desc: "Flip pairs — 4 modes, 3 sizes, 24 badges.", url: "games/memory/index.html" },
        { name: "connect-four", display: "Connect Four", emoji: "🔴", category: "Strategy", desc: "Line up four discs vs the computer — 14 badges.", url: "games/connect-four/index.html" },
        { name: "gomoku", display: "Gomoku", emoji: "🔵", category: "Strategy", desc: "Five in a row vs the computer — 14 badges.", url: "games/gomoku/index.html" },
        { name: "mancala", display: "Mancala", emoji: "🪨", category: "Strategy", desc: "Sow and capture stones vs the computer — 14 badges.", url: "games/mancala/index.html" },
        { name: "farkle", display: "Farkle", emoji: "🎰", category: "Dice", desc: "Push your luck — reach 3000 in 10 turns. 14 badges.", url: "games/farkle/index.html" },
        { name: "video-poker", display: "Video Poker", emoji: "🎴", category: "Card", desc: "Jacks or Better — hold, draw, hit the target. 14 badges.", url: "games/video-poker/index.html" },
        { name: "freecell", display: "FreeCell", emoji: "♣️", category: "Card", desc: "Classic open solitaire — free cells, foundations, undo. 14 badges.", url: "games/freecell/index.html" },
        { name: "tic-tac-toe", display: "Tic-Tac-Toe", emoji: "❌", category: "Strategy", desc: "Perfect AI, 3 levels + 2-player — 24 badges.", url: "games/tic-tac-toe/index.html" },
        { name: "pong", display: "Pong", emoji: "🏓", category: "Arcade", desc: "The classic two-paddle duel — 14 badges.", url: "games/pong/index.html" },
        { name: "breakout", display: "Breakout", emoji: "🧨", category: "Arcade", desc: "Bounce the ball and smash every brick — 14 badges.", url: "games/breakout/index.html" },
        { name: "whack-a-mole", display: "Whack-a-Mole", emoji: "🔨", category: "Reflex", desc: "Whack moles, chain combos — 4 modes, 24 badges.", url: "games/whack-a-mole/index.html" },
        { name: "blackjack", display: "Blackjack", emoji: "♠️", category: "Card", desc: "Get to 21 without busting — beat the dealer. 14 badges.", url: "games/blackjack/index.html" },
        { name: "chess", display: "Chess", emoji: "♟️", category: "Strategy", desc: "The classic strategy duel — vs an unbeatable-ish AI. 14 badges.", url: "games/chess/index.html" },
        { name: "solitaire", display: "Solitaire", emoji: "🃏", category: "Card", desc: "Klondike: stack the suits A→K and clear the board. 14 badges.", url: "games/solitaire/index.html" },
        { name: "minesweeper-variants", display: "Minesweeper Variants", emoji: "🚩", category: "Logic", desc: "Classic flood-fill or Saturation mode. 14 badges.", url: "games/minesweeper-variants/index.html" },
        { name: "tron", display: "Tron", emoji: "🏍️", category: "Arcade", desc: "Light-cycle duel — leave a trail, crash last. 14 badges.", url: "games/tron/index.html" },
        { name: "checkers", display: "Checkers", emoji: "🟠", category: "Strategy", desc: "Men jump, kings rule — beat the computer. 14 badges.", url: "games/checkers/index.html" },
        { name: "dominoes", display: "Dominoes", emoji: "🁫", category: "Strategy", desc: "Draw, Block or All Fives — beat the computer, 24 badges.", url: "games/dominoes/index.html" },
        { name: "othello", display: "Othello", emoji: "⚫", category: "Strategy", desc: "Flip discs to your colour — outflank the AI. 14 badges.", url: "games/othello/index.html" },
        { name: "battleship", display: "Battleship", emoji: "🚢", category: "Strategy", desc: "Hunt and sink the enemy fleet at sea. 14 badges.", url: "games/battleship/index.html" },
        { name: "nim", display: "Nim", emoji: "🪙", category: "Strategy", desc: "Take 1–3 counters vs a perfect CPU — 14 badges.", url: "games/nim/index.html" },
        { name: "dots-and-boxes", display: "Dots & Boxes", emoji: "🔷", category: "Strategy", desc: "Draw lines, trap boxes, beat the AI. 14 badges.", url: "games/dots-and-boxes/index.html" },
        { name: "nonogram", display: "Nonogram", emoji: "🧩", category: "Logic", desc: "Solve the picture from the number clues. 14 badges.", url: "games/nonogram/index.html" },
        { name: "grand-tour", display: "Grand Tour", emoji: "🌀", category: "Logic", desc: "Draw one loop through every dot — 4 difficulties, 24 badges.", url: "games/grand-tour/index.html" },
        { name: "word tile", display: "Word Tile", emoji: "🔤", category: "Word", desc: "Guess the 5-letter word in 6 tries — 14 badges.", url: "games/wordle/index.html" },
        { name: "lights-out", display: "Lights Out", emoji: "💡", category: "Puzzle", desc: "One click toggles a cross — 3 sizes, 24 badges.", url: "games/lights-out/index.html" },
        { name: "fifteen-puzzle", display: "15 Puzzle", emoji: "🧮", category: "Puzzle", desc: "Slide into order — 3 sizes, hints, 24 badges.", url: "games/fifteen-puzzle/index.html" },
        { name: "flow", display: "Flow", emoji: "🌈", category: "Puzzle", desc: "Connect the pipes — fill every cell. 14 badges.", url: "games/flow-puzzle/index.html" },
        { name: "simon", display: "Simon", emoji: "🎵", category: "Reflex", desc: "Repeat the sequence — 4 modes, 3 pad sets, 24 badges.", url: "games/simon/index.html" },
        { name: "yahtzee", display: "Yahtzee", emoji: "🎲", category: "Dice", desc: "Roll, hold, and score a 13-turn game. 14 badges.", url: "games/yahtzee/index.html" },
        { name: "stack", display: "Stack", emoji: "🏗️", category: "Arcade", desc: "Drop blocks onto the tower — stack high. 14 badges.", url: "games/stack/index.html" },
        { name: "flappy", display: "Flappy", emoji: "🐤", category: "Arcade", desc: "Tap to flap through the endless pipes. 14 badges.", url: "games/flappy/index.html" },
        { name: "frogger", display: "Frogger", emoji: "🐸", category: "Arcade", desc: "Dodge traffic, ride logs, fill all five home bays — 25 badges.", url: "games/frogger/index.html" },
        { name: "word-search", display: "Word Search", emoji: "🔍", category: "Word", desc: "Find the hidden words in a letter jungle. 14 badges.", url: "games/word-search/index.html" },
        { name: "boggle", display: "Boggle", emoji: "🔡", category: "Word", desc: "Connect adjacent letters — 4×4 and 5×5, 24 badges.", url: "games/boggle/index.html" },
        { name: "hangman", display: "Hangman", emoji: "🪢", category: "Word", desc: "Guess the word before the drawing is done. 14 badges.", url: "games/hangman/index.html" },
        { name: "jumble", display: "Jumble", emoji: "🔀", category: "Word", desc: "Unscramble the letters using the clue. 14 badges.", url: "games/jumble/index.html" },
        { name: "word-ladder", display: "Word Ladder", emoji: "🪜", category: "Word", desc: "Change one letter at a time to reach the goal. 14 badges.", url: "games/word-ladder/index.html" },
        { name: "cryptogram", display: "Cryptogram", emoji: "🕵️", category: "Word", desc: "Decode the secret message, letter by letter. 14 badges.", url: "games/cryptogram/index.html" },
        { name: "word square", display: "Word Square", emoji: "🔠", category: "Word", desc: "Fill the grid — every row and column is a word. 14 badges.", url: "games/word-square/index.html" },
        { name: "mastermind", display: "Mastermind", emoji: "🎯", category: "Logic", desc: "Crack the secret color code by logic — 14 badges.", url: "games/mastermind/index.html" },
        { name: "tower-of-hanoi", display: "Tower of Hanoi", emoji: "🗼", category: "Puzzle", desc: "Move the tower one ring at a time — 14 badges.", url: "games/tower-of-hanoi/index.html" },
        { name: "peg-solitaire", display: "Peg Solitaire", emoji: "🟢", category: "Puzzle", desc: "Jump and remove, leave one peg standing — 14 badges.", url: "games/peg-solitaire/index.html" },
        { name: "sokoban", display: "Sokoban", emoji: "📦", category: "Puzzle", desc: "Push every box onto a target — 14 badges.", url: "games/sokoban/index.html" },
      ];

      const displayName = (g) =>
        g.display ||
        g.name
          .split(/[-\s]+/)
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
          .join(" ");

      const gameCountLabel = (n) => `${n} ${n === 1 ? "game" : "games"}`;

      const closest = (target, selector) =>
        target instanceof Element ? target.closest(selector) : null;

      const grid = document.getElementById("grid");
      const toolbar = document.getElementById("toolbar");
      const filtersEl = document.getElementById("filters");
      const search = document.getElementById("search");
      const randomBtn = document.getElementById("random");
      const resultsEl = document.getElementById("results");
      const emptyEl = document.getElementById("empty");
      const emptyText = document.getElementById("empty-text");
      const clearBtn = document.getElementById("clear");
      const countEl = document.getElementById("game-count");
      const recentEl = document.getElementById("recent");
      const recentList = document.getElementById("recent-list");
      const toTop = document.getElementById("to-top");

      const STORAGE_KEYS = {
        favorites: "offline-arcade:favorites:v1",
        recent: "offline-arcade:recent:v1",
        theme: "offline-arcade:theme:v1",
      };

      const store = {
        get(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
          } catch {
            return fallback;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch {
            // Storage can be unavailable on file:// in some browsers.
          }
        },
      };

      const storedFavorites = store.get(STORAGE_KEYS.favorites, []);
      const favorites = new Set(Array.isArray(storedFavorites) ? storedFavorites : []);
      const state = { query: "", filter: "All" };
      const cards = new Map();

      // ---------- Build the card grid ----------
      const cardFrag = document.createDocumentFragment();

      for (const g of GAMES) {
        const wrap = document.createElement("div");
        wrap.className = "game-card-wrap";

        const card = document.createElement("a");
        card.className = "game-card";
        card.href = g.url;
        card.dataset.url = g.url;

        const emoji = document.createElement("span");
        emoji.className = "game-card__emoji";
        emoji.textContent = g.emoji;
        emoji.setAttribute("aria-hidden", "true");

        const name = document.createElement("span");
        name.className = "game-card__name";
        name.textContent = displayName(g);

        const desc = document.createElement("span");
        desc.className = "game-card__desc";
        desc.textContent = g.desc;

        card.append(emoji, name, desc);

        if (g.isNew) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "New";
          card.append(badge);
        }

        const fav = document.createElement("button");
        fav.type = "button";
        fav.className = "fav-btn";
        fav.dataset.url = g.url;
        fav.setAttribute("aria-pressed", String(favorites.has(g.url)));
        fav.setAttribute("aria-label", favoriteLabel(g, favorites.has(g.url)));

        const star = document.createElement("span");
        star.setAttribute("aria-hidden", "true");
        star.textContent = favorites.has(g.url) ? "★" : "☆";
        fav.append(star);

        wrap.append(card, fav);
        cardFrag.append(wrap);

        cards.set(g.url, { wrap, card, fav, game: g });
      }

      grid.append(cardFrag);

      // ---------- Favorites ----------
      function favoriteLabel(g, active) {
        return active
          ? `Remove ${displayName(g)} from favorites`
          : `Add ${displayName(g)} to favorites`;
      }

      function syncFavoriteButton(entry) {
        const active = favorites.has(entry.game.url);
        entry.fav.setAttribute("aria-pressed", String(active));
        entry.fav.setAttribute("aria-label", favoriteLabel(entry.game, active));
        const star = entry.fav.firstElementChild;
        if (star) star.textContent = active ? "★" : "☆";
      }

      grid.addEventListener("click", (event) => {
        const button = closest(event.target, ".fav-btn");
        if (!button) return;

        event.preventDefault();
        event.stopPropagation();

        const url = button.dataset.url;
        if (favorites.has(url)) favorites.delete(url);
        else favorites.add(url);

        store.set(STORAGE_KEYS.favorites, [...favorites]);

        const entry = cards.get(url);
        if (entry) syncFavoriteButton(entry);

        if (state.filter === "Favorites") applyFilters();
      });

      // ---------- Category filters ----------
      const filterValues = [
        "All",
        "Favorites",
        ...Array.from(
          new Set(GAMES.map((g) => g.category).filter(Boolean))
        ).sort(),
      ];

      const filterFrag = document.createDocumentFragment();

      for (const value of filterValues) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.dataset.filter = value;
        chip.setAttribute("aria-pressed", String(value === state.filter));

        if (value === "Favorites") {
          const star = document.createElement("span");
          star.setAttribute("aria-hidden", "true");
          star.textContent = "★ ";
          chip.append(star, document.createTextNode("Favorites"));
        } else {
          chip.textContent = value;
        }

        filterFrag.append(chip);
      }

      filtersEl.append(filterFrag);

      filtersEl.addEventListener("click", (event) => {
        const chip = closest(event.target, ".chip");
        if (!chip) return;

        state.filter = chip.dataset.filter;

        for (const candidate of filtersEl.querySelectorAll(".chip")) {
          candidate.setAttribute("aria-pressed", String(candidate === chip));
        }

        applyFilters();
      });

      // ---------- Search + filtering ----------
      search.addEventListener("input", () => {
        state.query = search.value.trim().toLowerCase();
        applyFilters();
      });

      function matchesFilter(g) {
        if (state.filter === "All") return true;
        if (state.filter === "Favorites") return favorites.has(g.url);
        return g.category === state.filter;
      }

      function applyFilters() {
        let visible = 0;

        for (const g of GAMES) {
          const entry = cards.get(g.url);
          const haystack = [g.name, displayName(g), g.desc, g.category, g.url]
            .join(" ")
            .toLowerCase();

          const show =
            (!state.query || haystack.includes(state.query)) && matchesFilter(g);

          entry.wrap.hidden = !show;
          if (show) visible++;
        }

        grid.hidden = visible === 0;
        emptyEl.hidden = visible !== 0;
        randomBtn.disabled = visible === 0;

        if (visible === 0 && state.filter === "Favorites" && !state.query) {
          emptyText.textContent =
            "No favorites yet — tap the star on any game to add it.";
        } else {
          emptyText.textContent = "No games match your search or filter.";
        }

        resultsEl.textContent =
          visible === GAMES.length
            ? gameCountLabel(GAMES.length)
            : `${visible} of ${GAMES.length} games`;
      }

      clearBtn.addEventListener("click", () => {
        state.query = "";
        state.filter = "All";
        search.value = "";

        for (const chip of filtersEl.querySelectorAll(".chip")) {
          chip.setAttribute("aria-pressed", String(chip.dataset.filter === "All"));
        }

        applyFilters();
        search.focus();
      });

      // ---------- Random game ----------
      randomBtn.addEventListener("click", () => {
        const visible = GAMES.filter((g) => !cards.get(g.url).wrap.hidden);
        if (!visible.length) return;

        const pick = visible[Math.floor(Math.random() * visible.length)];
        recordRecent(pick.url);
        window.location.href = pick.url;
      });

      // ---------- Recently played ----------
      function readRecent() {
        const value = store.get(STORAGE_KEYS.recent, []);
        return Array.isArray(value) ? value : [];
      }

      function recordRecent(url) {
        const list = readRecent().filter((item) => item !== url);
        list.unshift(url);
        store.set(STORAGE_KEYS.recent, list.slice(0, 6));
      }

      function renderRecent() {
        const recent = readRecent()
          .map((url) => GAMES.find((g) => g.url === url))
          .filter(Boolean)
          .slice(0, 4);

        if (!recent.length) return;

        for (const g of recent) {
          const item = document.createElement("a");
          item.className = "portal__recent-item";
          item.href = g.url;
          item.dataset.url = g.url;

          const emoji = document.createElement("span");
          emoji.className = "portal__recent-emoji";
          emoji.textContent = g.emoji;
          emoji.setAttribute("aria-hidden", "true");

          const label = document.createElement("span");
          label.textContent = displayName(g);

          item.append(emoji, label);
          recentList.append(item);
        }

        recentEl.hidden = false;
      }

      document.addEventListener("click", (event) => {
        const link = closest(event.target, "a[data-url]");
        if (!link) return;
        recordRecent(link.dataset.url);
      });

      // ---------- Keyboard shortcuts ----------
      document.addEventListener("keydown", (event) => {
        const active = document.activeElement;
        const isTyping =
          active &&
          (active.tagName === "INPUT" ||
            active.tagName === "TEXTAREA" ||
            active.isContentEditable);

        if (event.key === "/" && !isTyping) {
          event.preventDefault();
          search.focus();
        }

        if (event.key === "Escape" && active === search) {
          state.query = "";
          search.value = "";
          applyFilters();
          search.blur();
        }
      });

      // ---------- Back to top ----------
      function updateBackToTop() {
        toTop.hidden = window.scrollY < 400;
      }

      window.addEventListener("scroll", updateBackToTop, { passive: true });

      toTop.addEventListener("click", () => {
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;
        window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
      });

      // ---------- Theme picker ----------
      const THEME_KEY = STORAGE_KEYS.theme;
      const themeToggle = document.getElementById("theme-toggle");
      const themeMenu = document.getElementById("theme-menu");
      const themeLabel = document.getElementById("theme-label");
      const themeIcon = document.getElementById("theme-icon");
      const themeOptions = Array.from(
        themeMenu.querySelectorAll(".theme-option")
      );

      // The active choice: "system" when <html> has no data-theme.
      const currentChoice = () =>
        document.documentElement.dataset.theme || "system";

      const THEME_META = {
        system: { label: "Theme", icon: "🎨" },
        dark: { label: "Dark", icon: "🌙" },
        light: { label: "Light", icon: "☀️" },
        kids: { label: "Kids", icon: "🧸" },
      };

      function syncThemePicker() {
        const choice = currentChoice();
        for (const option of themeOptions) {
          option.setAttribute(
            "aria-checked",
            String(option.dataset.themeChoice === choice)
          );
        }
        const meta = THEME_META[choice] || THEME_META.system;
        themeLabel.textContent = meta.label;
        themeIcon.textContent = meta.icon;
      }

      function setTheme(choice) {
        if (choice === "system") {
          delete document.documentElement.dataset.theme;
        } else {
          document.documentElement.dataset.theme = choice;
        }

        try {
          if (choice === "system") localStorage.removeItem(THEME_KEY);
          else localStorage.setItem(THEME_KEY, JSON.stringify(choice));
        } catch {
          // Storage can be unavailable on file:// in some browsers.
        }

        // Keep the browser chrome in sync where supported.
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            "content",
            choice === "light" ? "#f4f5f9" : choice === "kids" ? "#1a1440" : "#0e0e11"
          );
        }

        closeThemeMenu();
        syncThemePicker();
      }

      function openThemeMenu() {
        themeMenu.hidden = false;
        themeToggle.setAttribute("aria-expanded", "true");
        const checked =
          themeOptions.find((o) => o.getAttribute("aria-checked") === "true") ||
          themeOptions[0];
        if (checked) checked.focus();
      }

      function closeThemeMenu() {
        themeMenu.hidden = true;
        themeToggle.setAttribute("aria-expanded", "false");
      }

      themeToggle.addEventListener("click", () => {
        if (themeMenu.hidden) openThemeMenu();
        else closeThemeMenu();
      });

      themeMenu.addEventListener("click", (event) => {
        const option = closest(event.target, ".theme-option");
        if (!option) return;
        setTheme(option.dataset.themeChoice);
        themeToggle.focus();
      });

      // Arrow-key navigation within the menu.
      themeMenu.addEventListener("keydown", (event) => {
        const idx = themeOptions.indexOf(document.activeElement);
        if (idx === -1) return;

        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          const dir = event.key === "ArrowDown" ? 1 : -1;
          const next =
            themeOptions[(idx + dir + themeOptions.length) % themeOptions.length];
          next.focus();
        }

        if (event.key === "Escape") {
          event.preventDefault();
          closeThemeMenu();
          themeToggle.focus();
        }
      });

      // Close the menu when clicking outside or pressing Escape elsewhere.
      document.addEventListener("click", (event) => {
        if (themeMenu.hidden) return;
        if (closest(event.target, ".theme-picker")) return;
        closeThemeMenu();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || themeMenu.hidden) return;
        closeThemeMenu();
        themeToggle.focus();
      });

      syncThemePicker();

      // ---------- Initial paint ----------
      countEl.textContent = gameCountLabel(GAMES.length);
      applyFilters();
      renderRecent();

      toolbar.hidden = false;
      filtersEl.hidden = false;
      resultsEl.hidden = false;
      updateBackToTop();
    })();
  </script>
</body>
</html>
